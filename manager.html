<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ম্যানেজার ও সাপোর্ট</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 95vh;
      box-sizing: border-box;
    }
    .support-card {
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
      box-sizing: border-box;
    }
    .icon-box {
      font-size: 40px;
      color: #343a40;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0 0 8px 0;
      color: #2b2d42;
      font-size: 20px;
    }
    p {
      color: #6c757d;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .support-info {
      background: #f8f9fa;
      border: 1px solid #e5e9f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 12px;
      color: #4c566a;
      text-align: left;
    }
    .support-info div {
      margin-bottom: 4px;
    }
    .support-info div:last-child {
      margin-bottom: 0;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 16px;
      border: none;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: opacity 0.2s;
      box-sizing: border-box;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .telegram-btn {
      background-color: #0088cc;
    }
    .whatsapp-btn {
      background-color: #25d366;
    }
    .ads-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 12px 0;
    }
    .ad-banner-container {
      padding: 6px;
      background: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #e5e9f0;
      text-align: center;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .back-btn {
      display: inline-block;
      margin-top: 10px;
      color: #6c757d;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="support-card">
    <div class="icon-box">
      <i class="fa-solid fa-headset"></i>
    </div>
    <h2>ম্যানেজার সাপোর্ট</h2>
    <p>যে কোনো সমস্যা বা অনুসন্ধানের জন্য সরাসরি আমাদের সাথে যোগাযোগ করুন।</p>

    <div class="support-info">
      <div>🕒 <strong>সাপোর্ট সময়:</strong> সকাল ১০:০০ টা - রাত ১০:০০ টা</div>
      <div>⚡ <strong>উত্তর পাওয়ার সময়:</strong> ৫ থেকে ১৫ মিনিট</div>
    </div>

    <!-- টেলিগ্রাম সাপোর্ট বাটন -->
    <button class="btn telegram-btn" onclick="openTelegramSupport()">
      <i class="fa-brands fa-telegram fa-lg"></i> টেলিগ্রামে মেসেজ দিন
    </button>

    <!-- হোয়াটসঅ্যাপ সাপোর্ট বাটন -->
    <button class="btn whatsapp-btn" onclick="openWhatsAppSupport()">
      <i class="fa-brands fa-whatsapp fa-lg"></i> হোয়াটসঅ্যাপে কথা বলুন
    </button>

    <!-- দুটি ব্যানার স্লট -->
    <div class="ads-wrapper">
      <!-- ব্যানার স্লট ১ -->
      <div class="ad-banner-container">
        <!-- এখানে আপনার Monetag ব্যানার অ্যাড স্ক্রিপ্ট কোড বসাবেন -->
        <span style="font-size: 11px; color: #a0aec0;">[ ব্যানার অ্যাড ১ ]</span>
      </div>

      <!-- ব্যানার স্লট ২ -->
      <div class="ad-banner-container">
        <!-- এখানে আপনার Monetag ব্যানার অ্যাড স্ক্রিপ্ট কোড বসাবেন -->
        <span style="font-size: 11px; color: #a0aec0;">[ ব্যানার অ্যাড ২ ]</span>
      </div>
    </div>

    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান</a>
  </div>

  <script>
    // টেলিগ্রাম সাপোর্ট লিংক খোলার নিরাপদ ফাংশন
    function openTelegramSupport() {
      const telegramUrl = "https://t.me/your_telegram_username"; // আপনার টেলিগ্রাম লিংক এখানে দিন
      if (navigator.share) {
        navigator.share({
          title: 'ম্যানেজার সাপোর্ট',
          text: 'টেলিগ্রামে যোগাযোগ করুন:',
          url: telegramUrl,
        }).catch(() => {});
      } else {
        window.open(telegramUrl, '_blank');
      }
    }

    // হোয়াটসঅ্যাপ সাপোর্ট লিংক খোলার নিরাপদ ফাংশন
    function openWhatsAppSupport() {
      const whatsappUrl = "https://wa.me/8801700000000"; // আপনার হোয়াটসঅ্যাপ নাম্বার এখানে দিন
      if (navigator.share) {
        navigator.share({
          title: 'ম্যানেজার সাপোর্ট',
          text: 'হোয়াটসঅ্যাপে যোগাযোগ করুন:',
          url: whatsappUrl,
        }).catch(() => {});
      } else {
        window.open(whatsappUrl, '_blank');
      }
    }
  </script>

</body>
</html>
