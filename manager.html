<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ম্যানেজার ও সাপোর্ট</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      box-sizing: border-box;
    }
    .support-card {
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
      box-sizing: border-box;
    }
    .icon-box {
      font-size: 50px;
      color: #343a40;
      margin-bottom: 15px;
    }
    h2 {
      margin: 0 0 10px 0;
      color: #2b2d42;
    }
    p {
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 25px;
    }
    /* বড় ও আকর্ষণীয় সাপোর্ট বাটন */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 15px;
      font-size: 17px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .telegram-btn {
      background-color: #0088cc;
    }
    .whatsapp-btn {
      background-color: #25d366;
    }

    /* অটো ব্যানার এড সেশন (ফাঁকা জায়গা পূরণের জন্য) */
    .ad-banner-container {
      margin-top: 20px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e5e9f0;
      text-align: center;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .back-btn {
      display: inline-block;
      margin-top: 15px;
      color: #6c757d;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="support-card">
    <div class="icon-box">
      <i class="fa-solid fa-headset"></i>
    </div>
    <h2>ম্যানেজার সাপোর্ট</h2>
    <p>যে কোনো সমস্যা বা অনুসন্ধানের জন্য সরাসরি আমাদের সাথে যোগাযোগ করুন[span_1](start_span)[span_1](end_span)।</p>

    <!-- টেলিগ্রাম লিংক -->
    <a href="https://t.me/your_telegram_username" target="_blank" class="btn telegram-btn">
      <i class="fa-brands fa-telegram fa-lg"></i> টেলিগ্রামে মেসেজ দিন
    </a>

    <!-- হোয়াটসঅ্যাপ লিংক -->
    <a href="https://wa.me/8801700000000" target="_blank" class="btn whatsapp-btn">
      <i class="fa-brands fa-whatsapp fa-lg"></i> হোয়াটসঅ্যাপে কথা বলুন
    </a>

    <!-- অটো ব্যানার অ্যাড স্লট (এখানে আপনার ব্যানার এডের স্ক্রিপ্ট ট্যাগ বসিয়ে দেবেন) -->
    <div class="ad-banner-container">
      <!-- Monetag বা Adsterra এর ব্যানার অ্যাড স্ক্রিপ্ট এখানে পেস্ট করবেন -->
      <script type="text/javascript">
        // আপনার ব্যানার এডের স্ক্রিপ্ট কোড এখানে বসবে
      </script>
      <span style="font-size: 12px; color: #a0aec0;">[ ব্যানার অ্যাড শো হবে ]</span>
    </div>

    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান</a>
  </div>

</body>
</html>
