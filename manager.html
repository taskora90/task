<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ম্যানেজার ও সাপোর্ট</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .support-card {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
    }
    .icon-box {
      font-size: 50px;
      color: #343a40;
      margin-bottom: 15px;
    }
    h2 {
      margin: 0 0 10px 0;
      color: #2b2d42;
    }
    p {
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .telegram-btn {
      background-color: #0088cc;
    }
    .whatsapp-btn {
      background-color: #25d366;
    }
    .back-btn {
      display: inline-block;
      margin-top: 15px;
      color: #6c757d;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="support-card">
    <div class="icon-box">
      <i class="fa-solid fa-headset"></i>
    </div>
    <h2>ম্যানেজার সাপোর্ট</h2>
    <p>যে কোনো সমস্যা বা অনুসন্ধানের জন্য সরাসরি আমাদের সাথে যোগাযোগ করুন।</p>

    <!-- টেলিগ্রাম লিংক -->
    <a href="https://t.me/your_telegram_username" target="_blank" class="btn telegram-btn">
      <i class="fa-brands fa-telegram"></i> টেলিগ্রামে মেসেজ দিন
    </a>

    <!-- হোয়াটসঅ্যাপ লিংক -->
    <a href="https://wa.me/8801700000000" target="_blank" class="btn whatsapp-btn">
      <i class="fa-brands fa-whatsapp"></i> হোয়াটসঅ্যাপে কথা বলুন
    </a>

    <a href="index.html" class="back-btn">← হোম পেজে ফিরে যান</a>
  </div>

</body>
</html>
