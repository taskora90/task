name: Auto Deduct Loan

on:
  schedule:
    - cron: '0 16 * * *' # প্রতিদিন বাংলাদেশ সময় রাত ১০:০০ টায় (16:00 UTC) রান করবে
  workflow_dispatch: # ম্যানুয়ালি টেস্ট করার বাটন

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node auto-deduct.js
        
