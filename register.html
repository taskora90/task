<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রেজিস্ট্রেশন - Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .reg-container {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .reg-container h2 {
      text-align: center;
      color: #2b2d42;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: bold;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .form-group input[readonly] {
      background-color: #e9ecef;
      color: #495057;
      cursor: not-allowed;
    }
    .submit-btn {
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="reg-container">
    <h2>নতুন অ্যাকাউন্ট তৈরি করুন</h2>

    <form id="registerForm">
      <div class="form-group">
        <label>আপনার নাম:</label>
        <input type="text" placeholder="পুরো নাম লিখুন" required>
      </div>

      <div class="form-group">
        <label>ফোন নম্বর:</label>
        <input type="tel" placeholder="০১৭XXXXXXXX" required>
      </div>

      <div class="form-group">
        <label>পাসওয়ার্ড:</label>
        <input type="password" placeholder="পাসওয়ার্ড দিন" required>
      </div>

      <div class="form-group">
        <label>রেফারেল আইডি (অটোমেটিক):</label>
        <!-- অটোমেটিক রেফারেল আইডি বসানোর ইনপুট -->
        <input type="text" id="refInput" placeholder="কোনো রেফারেল নেই" readonly>
      </div>

      <button type="submit" class="submit-btn">রেজিস্টার করুন</button>
    </form>
  </div>

  <script>
    // URL থেকে রেফারেল প্যারামিটার ( ?ref= ... ) খুঁজে বের করার লজিক
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const refCode = urlParams.get('ref'); // URL এর 'ref' অংশটি ধরবে

      if (refCode) {
        // যদি URL এ রেফারেল আইডি থাকে তবে তা ইনপুট বক্সে বসিয়ে দেবে
        document.getElementById('refInput').value = refCode;
      }
    };
  </script>

</body>
</html>
