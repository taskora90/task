<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রেজিস্ট্রেশন - Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .reg-container {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .reg-container h2 {
      text-align: center;
      color: #2b2d42;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: bold;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .form-group input[readonly] {
      background-color: #e9ecef;
      color: #495057;
      cursor: not-allowed;
    }
    .submit-btn {
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="reg-container">
    <h2>নতুন অ্যাকাউন্ট তৈরি করুন</h2>

    <form id="registerForm">
      <div class="form-group">
        <label>আপনার নাম:</label>
        <input type="text" id="nameInput" placeholder="পুরো নাম লিখুন" required>
      </div>

      <div class="form-group">
        <label>ফোন নম্বর:</label>
        <input type="tel" id="phoneInput" placeholder="০১৭XXXXXXXX" required>
      </div>

      <div class="form-group">
        <label>পাসওয়ার্ড:</label>
        <input type="password" id="passwordInput" placeholder="পাসওয়ার্ড দিন" required>
      </div>

      <div class="form-group">
        <label>রেফারেল আইডি (অটোমেটিক):</label>
        <input type="text" id="refInput" placeholder="কোনো রেফারেল নেই" readonly>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">রেজিস্ট্রেশন করুন</button>
    </form>
  </div>

  <!-- Firebase JavaScript Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
      authDomain: "taskora-b2b29.firebaseapp.com",
      projectId: "taskora-b2b29",
      storageBucket: "taskora-b2b29.firebasestorage.app",
      messagingSenderId: "376297360134",
      appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
      measurementId: "G-9803M7DPM5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // URL থেকে রেফারেল আইডি সেট করা (থাকলে পরিবর্তন করা যাবে না)
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const refCode = urlParams.get('ref');
      if (refCode && refCode.trim()) {
        document.getElementById('refInput').value = refCode.trim();
      }
    };

    async function findUplineDocRef(rawRefCode) {
      const cleanRef = String(rawRefCode || "").trim();
      if (!cleanRef || cleanRef === "none") return null;

      // ১. আগে সরাসরি UID হিসেবে doc(db, "users", cleanRef) যাচাই
      const directRef = doc(db, "users", cleanRef);
      const directSnap = await getDoc(directRef);
      if (directSnap.exists()) {
        return directRef;
      }

      // ২. না পেলে referralCode ফিল্ড দিয়ে কুয়েরি করে খোঁজা
      const q = query(collection(db, "users"), where("referralCode", "==", cleanRef));
      const querySnap = await getDocs(q);
      if (!querySnap.empty) {
        return querySnap.docs[0].ref;
      }

      return null;
    }

    const registerForm = document.getElementById('registerForm');
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('nameInput').value.trim();
      let phone = document.getElementById('phoneInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const refCode = document.getElementById('refInput').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      // বাংলা সংখ্যা ইংরেজিতে রূপান্তর এবং অপ্রয়োজনীয় স্পেস/ড্যাশ রিমুভ করা
      const bengaliDigits = {'০':'0', '১':'1', '২':'2', '৩':'3', '৪':'4', '৫':'5', '৬':'6', '৭':'7', '৮':'8', '৯':'9'};
      phone = phone.replace(/[০-৯]/g, match => bengaliDigits[match]).replace(/[\s-]/g, '');

      if (!name) {
        alert("দয়া করে আপনার নাম লিখুন!");
        return;
      }

      if (!phone || phone.length < 10) {
        alert("দয়া করে সঠিক ফোন নম্বর লিখুন!");
        return;
      }

      if (!password || password.length < 6) {
        alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!");
        return;
      }

      // সরাসরি ফোন নম্বর দিয়ে ভার্চুয়াল ইমেল তৈরি
      const virtualEmail = `${phone}@taskora.app`;

      submitBtn.disabled = true;
      submitBtn.innerText = "প্রসেসিং হচ্ছে...";

      try {
        // ১. ফায়ারবেস অথ-এ অ্যাকাউন্ট তৈরি
        const userCredential = await createUserWithEmailAndPassword(auth, virtualEmail, password);
        const user = userCredential.user;

        const cleanRef = (refCode && refCode !== "none" && refCode !== user.uid) ? refCode : "none";

        // ২. ফায়ারস্টোরে নতুন ইউজারের নিজস্ব ডাটা তৈরি
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          name: name,
          phone: phone,
          password: password,
          taskCash: 0,
          myCash: 0,
          totalEarnings: 0,
          teamCommission: 0,
          dailyTaskCount: 0,
          dailyTaskIncome: 0,
          luckySpinCount: 0,
          package: "none",
          referredBy: cleanRef,
          createdAt: serverTimestamp()
        });

        // ৩. রেফারার ডাটা আপডেট (UID অথবা referralCode উভয় ক্ষেত্রেই কাজ করবে)
        if (cleanRef !== "none") {
          try {
            const uplineRef = await findUplineDocRef(cleanRef);
            if (uplineRef && uplineRef.id !== user.uid) {
              await updateDoc(uplineRef, {
                teamMembers: arrayUnion({
                  uid: user.uid,
                  name: name,
                  phone: phone,
                  joinedAt: new Date().toISOString()
                })
              });
            }
          } catch (refErr) {
            console.error("রেফারার আপডেট করতে সমস্যা:", refErr);
          }
        }

        alert("রেজিস্ট্রেশন সফল হয়েছে!");
        window.location.href = "index.html";

      } catch (error) {
        console.error(error);
        alert("রেজিস্ট্রেশন ব্যর্থ হয়েছে: " + error.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "রেজিস্ট্রেশন করুন";
      }
    });
  </script>
