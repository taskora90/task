<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোন পেজ - Loan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 400px;
            margin: 0 auto;
        }
        /* নোটিফিকেশন বক্সের ডিজাইন */
        .loan-status-box {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }
        .loan-status-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .loan-status-box p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }
        /* লোন বাটন স্টাইল */
        .loan-btn {
            width: 100%;
            background: #ffc107;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .loan-btn:hover {
            background: #e0a800;
        }
        /* আপনার দেওয়া অ্যাড স্টাইল */
        .ads-wrapper {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- লোন স্ট্যাটাস মেসেজ বক্স -->
        <div class="loan-status-box" id="loanStatusBox">
            <h3 id="statusTitle">লোন সেকশন</h3>
            <p id="statusDesc">আপনি চাইলে নিচে থেকে লোন রিকোয়েস্ট পাঠাতে পারেন।</p>
            
            <!-- রিকোয়েস্ট পাঠানোর বাটন -->
            <div id="actionArea" style="display: block;">
                <button class="loan-btn" onclick="sendLoanRequest()">লোন রিকোয়েস্ট পাঠান</button>
            </div>
        </div>

        <!-- ব্যানার অ্যাড সেকশন -->
        <div class="ads-wrapper">
            <div class="ad-banner-container">
                <script async="async" data-cfasync="false" src="https://bauval.org/21/e67235acb5b7230c8c2fdb2cd4915292"></script>
                <div id="container-e67235acb5b7230c8c2fdb2cd4915292"></div>
            </div>
        </div>

    </div>

    <!-- Firebase JavaScript Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
          authDomain: "taskora-b2b29.firebaseapp.com",
          projectId: "taskora-b2b29",
          storageBucket: "taskora-b2b29.firebasestorage.app",
          messagingSenderId: "376297360134",
          appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
          measurementId: "G-9803M7DPM5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loanAmount = 1000; // লোনের পরিমাণ

        // লোন রিকোয়েস্ট পাঠানোর ফাংশন (সম্পূর্ণ আলাদা কালেকশনে ডাটা তৈরি হবে)
        window.sendLoanRequest = async function() {
            const user = auth.currentUser;
            if (!user) {
                alert("দয়া করে প্রথমে লগইন করুন।");
                return;
            }

            if (!confirm(`আপনি কি ${loanAmount} টাকার জন্য লোন রিকোয়েস্ট পাঠাতে চান?`)) return;

            try {
                // ইউজারের নাম বা ফোন নম্বর তোলার জন্য শুধু তার প্রোফাইল ডেটা পড়া হচ্ছে (কিন্তু ইউজারের টেবিলে কোনো লোন ফিল্ড বা পরিবর্তন করা হবে না)
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                const userData = userSnap.exists() ? userSnap.data() : {};

                // ফায়ারবেসে সম্পূর্ণ আলাদা 'loan_requests' কালেকশনে নতুন রিকোয়েস্ট ফাইল/ডকুমেন্ট তৈরি হবে
                await addDoc(collection(db, "loan_requests"), {
                    userId: user.uid,
                    userName: userData.name || "Unknown",
                    userPhone: userData.phone || "N/A",
                    amount: loanAmount,
                    status: "pending",
                    requestTime: serverTimestamp()
                });

                alert("আপনার লোন রিকোয়েস্ট সফলভাবে জমা হয়েছে!");

            } catch (error) {
                console.error("Error sending loan request: ", error);
                alert("রিকোয়েস্ট পাঠাতে সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।");
            }
        };
    </script>

</body>
</html>
