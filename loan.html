    <!-- Firebase এবং লোন লজিক স্ক্রিপ্ট -->
    <script type="module">
        // সরাসরি আপনার কনফিগ ফাইল থেকে db এবং auth ইমপোর্ট করা হলো
        import { db, auth } from './firebase-config.js'; 
        import { doc, getDoc, setDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const loanAmount = 1000; // লোন অ্যামাউন্ট

        // ইউজার লগইন আছে কি না চেক করা
        onAuthStateChanged(auth, (user) => {
            if (user) {
                listenUserLoanStatus(user.uid);
            } else {
                document.getElementById('statusTitle').innerText = "⚠️ লগইন প্রয়োজন";
                document.getElementById('statusDesc').innerText = "লোন পেজ দেখতে বা রিকোয়েস্ট পাঠাতে দয়া করে প্রথমে আপনার অ্যাকাউন্টে লগইন করুন।";
            }
        });

        // ইউজারের লোন স্ট্যাটাস ট্র্যাক করার ফাংশন
        function listenUserLoanStatus(userId) {
            const userRef = doc(db, "users", userId);

            onSnapshot(userRef, (docSnap) => {
                const titleEl = document.getElementById('statusTitle');
                const descEl = document.getElementById('statusDesc');
                const actionArea = document.getElementById('actionArea');

                let loanStatus = "none";
                if (docSnap.exists()) {
                    loanStatus = docSnap.data().loan_status || "none";
                }

                if (loanStatus === "none") {
                    titleEl.innerText = "⚠️ কোনো লোন কার্যকর নেই";
                    descEl.innerText = `দুঃখিত, এই মুহূর্তে আপনার কোনো লোন নেই। আপনি চাইলে ১,০০০ টাকার জন্য লোন রিকোয়েস্ট পাঠাতে পারেন।`;
                    actionArea.style.display = "block";
                    actionArea.innerHTML = `<button class="loan-btn" onclick="sendLoanRequest()">লোন রিকোয়েস্ট পাঠান</button>`;
                } 
                else if (loanStatus === "pending") {
                    titleEl.innerText = "⏳ লোন রিকোয়েস্ট পেন্ডিং আছে";
                    descEl.innerText = "আপনার লোন রিকোয়েস্টটি অ্যাডমিন প্যানেলে পর্যালোচনায় রয়েছে। অনুগ্রহ করে অ্যাডমিন অ্যাপ্রুভ করা পর্যন্ত অপেক্ষা করুন।";
                    actionArea.style.display = "none";
                } 
                else if (loanStatus === "active") {
                    titleEl.innerText = "✅ লোন কার্যকর রয়েছে";
                    descEl.innerText = `আপনার ${loanAmount} টাকার লোন সফলভাবে অ্যাপ্রুভ হয়েছে এবং আপনার My Cash ব্যালেন্সে যুক্ত করা হয়েছে।`;
                    actionArea.style.display = "none";
                }
            });
        }

        // লোন রিকোয়েস্ট সার্ভারে পাঠানোর ফাংশন
        window.sendLoanRequest = async function() {
            const user = auth.currentUser;
            if (!user) {
                alert("দয়া করে প্রথমে লগইন করুন।");
                return;
            }

            if (!confirm(`আপনি কি ${loanAmount} টাকার জন্য লোন রিকোয়েস্ট পাঠাতে চান?`)) return;

            try {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                const userData = userSnap.exists() ? userSnap.data() : {};

                // ১. users কালেকশনে লোন স্ট্যাটাস 'pending' করা
                await setDoc(userRef, {
                    loan_status: "pending",
                    loan_amount: loanAmount
                }, { merge: true });

                // ২. loan_requests কালেকশনে অ্যাডমিনের দেখার জন্য রিকোয়েস্ট সেভ করা
                await addDoc(collection(db, "loan_requests"), {
                    userId: user.uid,
                    userName: userData.name || userData.fullName || "Unknown User",
                    userPhone: userData.phone || user.email || "N/A",
                    amount: loanAmount,
                    status: "pending",
                    request_date: new Date().toISOString()
                });

                alert("আপনার লোন রিকোয়েস্ট সফলভাবে অ্যাডমিনের কাছে পাঠানো হয়েছে!");

            } (error) {
                console.error("Error sending loan request: ", error);
                alert("রিকোয়েস্ট পাঠাতে সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।");
            }
        };
    </script>
