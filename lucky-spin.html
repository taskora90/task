<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লাকি স্পিন</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f6f8fa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    /* হেডার */
    .top-banner {
      width: 100%;
      background: #2d3748;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .back-btn { color: white; font-size: 20px; text-decoration: none; }
    .top-banner h2 { font-size: 20px; flex: 1; text-align: center; margin-right: 25px; }

    .container { width: 100%; max-width: 420px; padding: 20px; text-align: center; }

    /* পুরস্কারের পরিমাণ বক্স */
    .reward-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      border: 2px solid #ffd700;
    }
    .reward-box p { font-size: 15px; color: #666; margin-bottom: 5px; font-weight: bold; }
    .reward-amount { font-size: 26px; font-weight: bold; color: #28a745; }

    /* লাকি স্পিনের সংখ্যা বক্স */
    .spin-count-box {
      background: white;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      font-size: 15px;
      font-weight: bold;
      color: #2d3748;
      border: 2px solid #ffd700;
    }

    /* বাইরের প্রিমিয়াম গোল্ডেন রিং হুইল কনটেইনার */
    .wheel-container {
      position: relative;
      width: 340px;
      height: 340px;
      margin: 0 auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffcc00, #ff9900, #ffcc00);
      border: 10px solid #d4af37;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(255,255,255,0.6);
    }

    /* চারপাশে লাল রঙের টুপটুপ করে জ্বলা লাইট অ্যানিমেশন */
    @keyframes redLightBlink {
      0% { background-color: #ff4d4d; box-shadow: 0 0 10px #ff0000, 0 0 15px #ff4d4d; }
      50% { background-color: #550000; box-shadow: 0 0 2px #220000; }
      100% { background-color: #ff4d4d; box-shadow: 0 0 10px #ff0000, 0 0 15px #ff4d4d; }
    }

    .wheel-light {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      z-index: 25;
      animation: redLightBlink 0.8s infinite alternate;
    }
    
    .light-0 { top: 10px; left: 50%; transform: translateX(-50%); animation-delay: 0.1s; }
    .light-1 { top: 50px; right: 50px; animation-delay: 0.3s; }
    .light-2 { top: 50%; right: 10px; transform: translateY(-50%); animation-delay: 0.5s; }
    .light-3 { bottom: 50px; right: 50px; animation-delay: 0.7s; }
    .light-4 { bottom: 10px; left: 50%; transform: translateX(-50%); animation-delay: 0.2s; }
    .light-5 { bottom: 50px; left: 50px; animation-delay: 0.4s; }
    .light-6 { top: 50%; left: 10px; transform: translateY(-50%); animation-delay: 0.6s; }
    .light-7 { top: 50px; left: 50px; animation-delay: 0.8s; }

    /* ভেতরের চাকা (অ্যাশ কালার ব্যাকগ্রাউন্ড)[span_1](start_span)[span_1](end_span) */
    .wheel {
      width: 275px;
      height: 275px;
      border-radius: 50%;
      position: relative;
      transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
      background: #cbd5e1;
      border: 4px dashed #64748b;
    }

    /* চাকার আইটেম/কার্ডসমূহ */
    .item {
      position: absolute;
      width: 75px;
      height: 55px;
      background: #ffffff;
      border: 2px solid #94a3b8;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
      color: #333;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    }

    /* ৬টি পজিশন */
    .item-0 { top: 10px; left: 50%; transform: translateX(-50%); }
    .item-1 { top: 55px; right: 12px; }
    .item-2 { bottom: 55px; right: 12px; }
    .item-3 { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .item-4 { bottom: 55px; left: 12px; }
    .item-5 { top: 55px; left: 12px; }

    .try-again-text { color: #dc3545; font-size: 12px; }
    .money-text { color: #28a745; font-size: 15px; }

    /* মাঝের শুরু বাটন (গোল্ডেন স্টাইল)[span_2](start_span)[span_2](end_span) */
    .spin-btn {
      position: absolute;
      width: 85px;
      height: 85px;
      background: linear-gradient(135deg, #ffcc00, #ff9900);
      color: #fff;
      border-radius: 50%;
      border: 4px solid #ffffff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .spin-btn:active { transform: scale(0.95); }

    /* ইন্ডিকেটর / পয়েন্টার */
    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid #dc354e;
      z-index: 30;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
    }

    .ads-wrapper {
      margin-top: 30px;
      width: 100%;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- শীর্ষ ব্যানার -->
  <header class="top-banner">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>লাকি স্পিন</h2>
  </header>

  <div class="container">
    <!-- পুরস্কারের পরিমাণ বক্স -->
    <div class="reward-box">
      <p>পুরস্কারের পরিমাণ</p>
      <div class="reward-amount">৳ <span id="reward-display">0.00</span></div>
    </div>

    <!-- লাকি স্পিনের সংখ্যা বক্স -->
    <div class="spin-count-box">
      অবশিষ্ট লাকি স্পিন: <span id="spinCountDisplay">0</span> টি
    </div>

    <!-- লাকি স্পিন হুইল -->
    <div class="wheel-container">
      <div class="pointer"></div>

      <!-- লাল রঙের টুপটুপ করে জ্বলা লাইটসমূহ -->
      <div class="wheel-light light-0"></div>
      <div class="wheel-light light-1"></div>
      <div class="wheel-light light-2"></div>
      <div class="wheel-light light-3"></div>
      <div class="wheel-light light-4"></div>
      <div class="wheel-light light-5"></div>
      <div class="wheel-light light-6"></div>
      <div class="wheel-light light-7"></div>

      <!-- ঘুরার চাকা (অ্যাশ ব্যাকগ্রাউন্ড ও আপডেট করা অ্যামাউন্ট) -->
      <div class="wheel" id="wheel">
        <div class="item item-0 try-again-text">Try Again</div>
        <div class="item item-1 money-text">৳ 50</div>
        <div class="item item-2 money-text">৳ 100</div>
        <div class="item item-3 money-text">৳ 10</div>
        <div class="item item-4 money-text">৳ 150</div>
        <div class="item item-5 money-text">৳ 20</div>
      </div>

      <!-- মাঝের শুরু বাটন -->
      <div class="spin-btn" id="spinBtn" onclick="spinWheel()">শুরু</div>
    </div>

    <div class="ads-wrapper">
      <!-- ব্যানার স্লট ১ -->
      <div class="ad-banner-container">
        <script>
          atOptions = {
            'key' : 'edb0510109f6c4d56e1c54025858881c',
            'format' : 'iframe',
            'height' : 250,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script type="text/javascript" src="//www.highperformanceformat.com/edb0510109f6c4d56e1c54025858881c/invoke.js"></script>
        <script src="https://bauval.org/22/edb0510109f6c4d56e1c54025858881c"></script>
        <span style="font-size: 11px; color: #a0aec0;"></span>
      </div>
    </div>
  </div>

  <!-- Firebase Script & Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
      authDomain: "taskora-b2b29.firebaseapp.com",
      projectId: "taskora-b2b29",
      storageBucket: "taskora-b2b29.firebasestorage.app",
      messagingSenderId: "376297360134",
      appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
      measurementId: "G-9803M7DPM5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const items = [
      { name: "Try Again", amount: 0 },
      { name: "৳ 50", amount: 50 },
      { name: "৳ 100", amount: 100 },
      { name: "৳ 10", amount: 10 },
      { name: "৳ 150", amount: 150 },
      { name: "৳ 20", amount: 20 }
    ];

    let currentRotation = 0;
    let isSpinning = false;
    let userDocRef = null;
    let availableSpins = 0;
    let currentUserObj = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserObj = user;
        userDocRef = doc(db, "users", user.uid);
        try {
          const userDoc = await getDoc(userDocRef);
          if (userDoc.exists()) {
            const userData = userDoc.data();

            availableSpins = userData.luckySpinCount !== undefined ? Number(userData.luckySpinCount) : 0;
            document.getElementById('spinCountDisplay').innerText = availableSpins;

            if (availableSpins <= 0) {
              document.getElementById('spinBtn').style.opacity = "0.5";
            }
          }

          const historySnap = await getDocs(collection(db, "users", user.uid, "spinHistory"));
          let totalSpinEarnings = 0;
          historySnap.forEach((docSnap) => {
            const historyData = docSnap.data();
            if (historyData.amount) {
              totalSpinEarnings += Number(historyData.amount);
            }
          });

          document.getElementById('reward-display').innerText = totalSpinEarnings.toFixed(2);

        } catch (error) {
          console.error("স্পিন ডাটা আনতে সমস্যা:", error);
        }
      } else {
        window.location.href = "login.html";
      }
    });

    window.spinWheel = async function() {
      if (isSpinning) return;

      if (availableSpins <= 0) {
        alert("আপনার কোনো লাকি স্পিন বাকি নেই!");
        return;
      }

      isSpinning = true;
      const selectedIndex = Math.floor(Math.random() * items.length);
      const degreesPerItem = 360 / items.length;
      const extraRounds = 360 * 5; 
      const targetDegree = extraRounds + (360 - (selectedIndex * degreesPerItem));

      currentRotation += targetDegree;
      const wheel = document.getElementById('wheel');
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(async () => {
        isSpinning = false;
        const prize = items[selectedIndex];

        try {
          let updateData = {
            luckySpinCount: increment(-1)
          };

          if (prize.amount > 0) {
            updateData.taskCash = increment(prize.amount);
            updateData.totalEarnings = increment(prize.amount);
          }

          await updateDoc(userDocRef, updateData);

          if (prize.amount > 0 && currentUserObj) {
            await addDoc(collection(db, "users", currentUserObj.uid, "spinHistory"), {
              title: "লাকি স্পিন",
              desc: `স্পিন করে ${prize.name} জিতেছেন`,
              amount: Number(prize.amount),
              timestamp: serverTimestamp()
            });
          }

          if (prize.amount > 0) {
            alert(`অভিনন্দন! আপনি জিতেছেন ${prize.name}। এটি আপনার অ্যাকাউন্টে জমা হয়েছে।`);
          } else {
            alert("ধন্যবাদ! আবার চেষ্টা করুন (Try Again)।");
          }

          location.reload(); 
        } catch (error) {
          console.error("পুরস্কার আপডেট করতে সমস্যা:", error);
          alert("ত্রুটি ঘটেছে, আবার চেষ্টা করুন।");
          isSpinning = false;
        }
      }, 4000);
    }
  </script>

</body>
</html>
