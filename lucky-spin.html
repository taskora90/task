<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লাকি স্পিন</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #e5e5e5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* হেডার */
    .top-banner {
      width: 100%;
      background: #777;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .back-btn { color: white; font-size: 20px; text-decoration: none; }
    .top-banner h2 { font-size: 20px; flex: 1; text-align: center; margin-right: 25px; }

    .container { width: 100%; max-width: 420px; padding: 20px; text-align: center; }

    /* পুরস্কারের পরিমাপ বক্স */
    .reward-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .reward-box p { font-size: 15px; color: #666; margin-bottom: 5px; font-weight: bold; }
    .reward-amount { font-size: 26px; font-weight: bold; color: #28a745; }

    /* লাকি স্পিনের সংখ্যা বক্স (নতুন যুক্ত করা হয়েছে) */
    .spin-count-box {
      background: white;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      font-size: 15px;
      font-weight: bold;
      color: #007bff;
    }

    /* স্পিন হুইল কনটেইনার */
    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto;
      border-radius: 50%;
      background: #8e8e8e;
      border: 8px solid #666;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    /* ঘূর্ণায়মান চাকা */
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
      background: #b0b0b0;
    }

    /* চাকার আইটেম/বাটনসমূহ */
    .item {
      position: absolute;
      width: 80px;
      height: 60px;
      background: #ffffff;
      border: 2px solid #666;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 15px;
      color: #333;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* ৬টি পজিশন */
    .item-0 { top: 15px; left: 50%; transform: translateX(-50%); }
    .item-1 { top: 75px; right: 15px; }
    .item-2 { bottom: 75px; right: 15px; }
    .item-3 { bottom: 15px; left: 50%; transform: translateX(-50%); }
    .item-4 { bottom: 75px; left: 15px; }
    .item-5 { top: 75px; left: 15px; }

    .try-again-text { color: #d93025; font-size: 13px; }
    .money-text { color: #1e8e3e; font-size: 16px; }

    /* শুরু বাটন (মাঝখানে) */
    .spin-btn {
      position: absolute;
      width: 90px;
      height: 90px;
      background: #555;
      color: #fff;
      border-radius: 50%;
      border: 4px solid #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .spin-btn:active { transform: scale(0.95); }

    /* ইন্ডিকেটর / পয়েন্টার */
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 22px solid #d93025;
      z-index: 12;
    }
  </style>
</head>
<body>

  <!-- শীর্ষ ব্যানার -->
  <header class="top-banner">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>লাকি স্পিন</h2>
  </header>

  <div class="container">
    <!-- পুরস্কারের পরিমাণ বক্স -->
    <div class="reward-box">
      <p>পুরস্কারের পরিমাণ</p>
      <div class="reward-amount">৳ <span id="reward-display">0.00</span></div>
    </div>

    <!-- লাকি স্পিনের সংখ্যা বক্স -->
    <div class="spin-count-box">
      অবশিষ্ট লাকি স্পিন: <span id="spinCountDisplay">0</span> টি
    </div>

    <!-- লাকি স্পিন হুইল -->
    <div class="wheel-container">
      <div class="pointer"></div>

      <!-- ঘুরার চাকা -->
      <div class="wheel" id="wheel">
        <div class="item item-0 try-again-text">Try Again</div>
        <div class="item item-1 money-text">৳ 50</div>
        <div class="item item-2 money-text">৳ 100</div>
        <div class="item item-3 try-again-text">Try Again</div>
        <div class="item item-4 money-text">৳ 150</div>
        <div class="item item-5 money-text">৳ 20</div>
      </div>

      <!-- মাঝের শুরু বাটন -->
      <div class="spin-btn" id="spinBtn" onclick="spinWheel()">শুরু</div>
    </div>
  </div>

  <!-- Firebase Script & Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
      authDomain: "taskora-b2b29.firebaseapp.com",
      projectId: "taskora-b2b29",
      storageBucket: "taskora-b2b29.firebasestorage.app",
      messagingSenderId: "376297360134",
      appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
      measurementId: "G-9803M7DPM5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const items = [
      { name: "Try Again", amount: 0 },
      { name: "৳ 50", amount: 50 },
      { name: "৳ 100", amount: 100 },
      { name: "Try Again", amount: 0 },
      { name: "৳ 150", amount: 150 },
      { name: "৳ 20", amount: 20 }
    ];

    let currentRotation = 0;
    let isSpinning = false;
    let userDocRef = null;
    let availableSpins = 0;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        userDocRef = doc(db, "users", user.uid);
        try {
          const userDoc = await getDoc(userDocRef);
          if (userDoc.exists()) {
            const userData = userDoc.data();
            availableSpins = userData.luckySpinCount || 0;
            document.getElementById('spinCountDisplay').innerText = availableSpins;

            if (availableSpins <= 0) {
              document.getElementById('spinBtn').style.opacity = "0.5";
            }
          }
        } catch (error) {
          console.error("স্পিন ডাটা আনতে সমস্যা:", error);
        }
      } else {
        window.location.href = "login.html";
      }
    });

    window.spinWheel = async function() {
      if (isSpinning) return;

      if (availableSpins <= 0) {
        alert("আপনার কোনো লাকি স্পিন বাকি নেই!");
        return;
      }

      isSpinning = true;
      const selectedIndex = Math.floor(Math.random() * items.length);
      const degreesPerItem = 360 / items.length;
      const extraRounds = 360 * 5; 
      const targetDegree = extraRounds + (360 - (selectedIndex * degreesPerItem));
      
      currentRotation += targetDegree;
      const wheel = document.getElementById('wheel');
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(async () => {
        isSpinning = false;
        const prize = items[selectedIndex];

        try {
          // স্পিন সংখ্যা ১ কমিয়ে দেওয়া এবং taskCash এ টাকা যোগ করা
          let updateData = {
            luckySpinCount: increment(-1)
          };

          if (prize.amount > 0) {
            updateData.taskCash = increment(prize.amount);
            updateData.totalEarned = increment(prize.amount);
          }

          await updateDoc(userDocRef, updateData);

          if (prize.amount > 0) {
            alert(`অভিনন্দন! আপনি জিতেছেন ${prize.name}। এটি আপনার টাস্ক ক্যাশে জমা হয়েছে।`);
            let currentReward = parseFloat(document.getElementById('reward-display').innerText);
            document.getElementById('reward-display').innerText = (currentReward + prize.amount).toFixed(2);
          } else {
            alert("ধন্যবাদ! আবার চেষ্টা করুন (Try Again)।");
          }

          location.reload(); // পেজ রিলোড করে স্পিন কাউন্ট আপডেট করা
        } catch (error) {
          console.error("পুরস্কার আপডেট করতে সমস্যা:", error);
          alert("ত্রুটি ঘটেছে, আবার চেষ্টা করুন।");
        }
      }, 4000);
    }
  </script>
</body>
</html>
