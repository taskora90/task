<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-banner">
        <h2>প্রোফাইল</h2>
    </header>

    <div class="profile-container">
        <!-- ইউজার ইনফো -->
        <div class="profile-card">
            <i class="fa-solid fa-user-circle profile-icon"></i>
            <h3 id="userName">লোড হচ্ছে...</h3>
            <p id="userEmail">লোড হচ্ছে...</p>
        </div>

        <!-- ব্যালেন্স ও আয় সমূহ -->
        <div class="balance-grid">
            <div class="balance-box">
                <h4>মূল ব্যালেন্স (মাই ক্যাশ)</h4>
                <p id="userBalance">৳ ০</p>
            </div>
            <div class="balance-box">
                <h4>টাস্ক ক্যাশ</h4>
                <p id="userTaskCash">৳ ০</p>
            </div>
            <div class="balance-box">
                <h4>মোট আয়</h4>
                <p id="userTotalEarned">৳ ০</p>
            </div>
            <div class="balance-box">
                <h4>আমন্ত্রণ আয়</h4>
                <p id="userInviteEarn">৳ ০</p>
            </div>
            <div class="balance-box">
                <h4>টিম কমিশন</h4>
                <p id="userTeamCommission">৳ ০</p>
            </div>
            <div class="balance-box">
                <h4>আজকের টিম কমিশন</h4>
                <p id="userTodayTeamCommission">৳ ০</p>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>হোম</span>
        </a>
        <a href="task.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>টাস্ক</span>
        </a>
        <a href="team.html" class="nav-item">
            <i class="fa-solid fa-users"></i>
            <span>টিম</span>
        </a>
        <a href="package.html" class="nav-item">
            <i class="fa-solid fa-box"></i>
            <span>প্যাকেজ</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>প্রোফাইল</span>
        </a>
    </nav>

    <!-- Firebase Profile Logic -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const userDocRef = doc(db, "users", user.uid);
          try {
            const userDoc = await getDoc(userDocRef);
            if (userDoc.exists()) {
              const data = userDoc.data();

              // দৈনিক রিসেট চেক (আজকের টিম কমিশন রাত ১২টার পর শূন্য করার জন্য)
              const lastResetDate = data.lastResetDate || "";
              const todayStr = new Date().toDateString();
              
              let todayTeamComm = data.todayTeamCommission || 0;
              if (lastResetDate !== todayStr) {
                todayTeamComm = 0;
                await updateDoc(userDocRef, {
                  todayTeamCommission: 0,
                  lastResetDate: todayStr
                });
              }

              // UI এ ডাটা বসানো
              document.getElementById("userName").innerText = data.name || "নাম পাওয়া যায়নি";
              document.getElementById("userEmail").innerText = data.email || user.email;
              document.getElementById("userBalance").innerText = `৳ ${data.balance || 0}`;
              document.getElementById("userTaskCash").innerText = `৳ ${data.taskCash || 0}`;
              document.getElementById("userTotalEarned").innerText = `৳ ${data.totalEarned || 0}`;
              document.getElementById("userInviteEarn").innerText = `৳ ${data.inviteEarn || 0}`;
              document.getElementById("userTeamCommission").innerText = `৳ ${data.teamCommission || 0}`;
              document.getElementById("userTodayTeamCommission").innerText = `৳ ${todayTeamComm}`;
            }
          } catch (error) {
            console.error("প্রোফাইল ডাটা লোড করতে সমস্যা হয়েছে:", error);
          }
        } else {
          window.location.href = "login.html";
        }
      });
    </script>
</body>
</html>
