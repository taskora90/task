<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="profile-container">
        
        <!-- ইউজার স্ট্যাটাস হেডার (প্যাকেজ, নাম, ফোন ও আইকন) -->
        <div class="user-status-card">
            <div class="user-avatar">
                <i class="fa-solid fa-user"></i>
                <span id="userPackageBadge" class="package-tag">G.0</span>
            </div>
            <div class="user-info-text">
                <p>দল স্তর: <span id="userPackageName">কোনো প্যাকেজ নেই</span></p>
                <p>মেয়াদ: <span id="userPackageExpiry">২০২৭.০৬.২৩</span></p>
                <p>হিসাব: <span id="userPhone">লোড হচ্ছে...</span></p>
                <p>সেবা ফি: <span id="userPackageFee">0.00</span></p>
            </div>
        </div>

        <!-- মোট আয় বক্স -->
        <div class="total-earn-box">
            <p>মোট আয়</p>
            <h2 id="userTotalEarned">0</h2>
        </div>

        <!-- ব্যালেন্স ও আয় সমূহ গ্রিড -->
        <div class="balance-grid">
            <div class="balance-box">
                <h4>টিম কমিশন</h4>
                <p id="userTeamCommission">০</p>
            </div>
            <div class="balance-box">
                <h4>আমন্ত্রণ আয়</h4>
                <p id="userInviteEarn">০</p>
            </div>
            <div class="balance-box">
                <h4>ডেইলি টাস্ক</h4>
                <p id="userTaskCash">০</p>
            </div>
            <div class="balance-box">
                <h4>আজকের টিম কমিশন</h4>
                <p id="userTodayTeamCommission">০</p>
            </div>
            <div class="balance-box dark-box">
                <h4>মাই ক্যাশ</h4>
                <p id="userBalance">০.০০</p>
            </div>
            <div class="balance-box dark-box">
                <h4>টাস্ক ক্যাশ</h4>
                <p id="userTaskCashBox">০</p>
            </div>
        </div>

        <!-- মেনু লিঙ্কসমূহ -->
        <div class="menu-links">
            <a href="task.html" class="menu-item">কাজের বিবরণ</a>
            <a href="withdrawal-records.html" class="menu-item">টাকা উত্তোলনের রেকর্ড</a>
            <a href="guideline.html" class="menu-item">কর্মী নির্দেশিকা</a>
        </div>

        <!-- লগআউট বাটন -->
        <div class="logout-container">
            <a href="#" id="logoutBtn" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i> লগআউট
            </a>
        </div>
    </div>

    <!-- Firebase Profile & Package Info Logic -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // প্যাকেজ অনুযায়ী নাম ও ফি ম্যাপিং
      const packageDetails = {
        "G.1": { name: "প্যাকেজ ১ (AI প্রশিক্ষক / Task.1)", fee: 3000 },
        "G.2": { name: "প্যাকেজ ২ (AI প্রশিক্ষক / Task.2)", fee: 4500 },
        "G.3": { name: "প্যাকেজ ৩ (AI প্রশিক্ষক / Task.3)", fee: 6000 },
        "G.4": { name: "প্যাকেজ ৪ (AI প্রশিক্ষক / Task.4)", fee: 7500 }
      };

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const userDocRef = doc(db, "users", user.uid);
          try {
            const userDoc = await getDoc(userDocRef);
            if (userDoc.exists()) {
              const data = userDoc.data();

              // দৈনিক টিম কমিশন রিসেট লজিক
              const lastResetDate = data.lastResetDate || "";
              const todayStr = new Date().toDateString();
              
              let todayTeamComm = data.todayTeamCommission || 0;
              if (lastResetDate !== todayStr) {
                todayTeamComm = 0;
                await updateDoc(userDocRef, {
                  todayTeamCommission: 0,
                  lastResetDate: todayStr
                });
              }

              // প্রোফাইল হেডার ডাটা বসানো
              const userPkg = data.package || "G.1";
              document.getElementById("userPackageBadge").innerText = userPkg;
              document.getElementById("userPackageName").innerText = packageDetails[userPkg]?.name || userPkg;
              document.getElementById("userPhone").innerText = data.phone || user.phoneNumber || "নম্বর নেই";
              document.getElementById("userPackageFee").innerText = packageDetails[userPkg]?.fee || 0;

              // বাকি ব্যালেন্স ও আর্নিং ডাটা বসানো
              document.getElementById("userTotalEarned").innerText = data.totalEarned || 0;
              document.getElementById("userTeamCommission").innerText = data.teamCommission || 0;
              document.getElementById("userInviteEarn").innerText = data.inviteEarn || 0;
              document.getElementById("userTaskCash").innerText = data.dailyTask || 0;
              document.getElementById("userTodayTeamCommission").innerText = todayTeamComm;
              document.getElementById("userBalance").innerText = data.balance || 0;
              document.getElementById("userTaskCashBox").innerText = data.taskCash || 0;
            }
          } catch (error) {
            console.error("প্রোফাইল ডাটা লোড করতে সমস্যা হয়েছে:", error);
          }
        } else {
          window.location.href = "login.html";
        }
      });

      // লগআউট হ্যান্ডলার
      document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault();
        signOut(auth).then(() => {
          window.location.href = "login.html";
        }).catch((error) => {
          console.error("লগআউট করতে সমস্যা হয়েছে:", error);
        });
      });
    </script>
</body>
</html>
