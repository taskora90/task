<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="profile-container">

        <!-- ইউজার স্ট্যাটাস হেডার -->
        <div class="user-status-card">
            <div class="user-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="user-info-text">
                <h3 id="userPackageName" style="margin: 0 0 5px 0; color: #2b78e4; font-size: 16px;">প্যাকেজ নির্বাচন করা হয়নি</h3>
                <p>নাম: <span id="userName">লোড হচ্ছে...</span></p>
                <p>মোবাইল নাম্বার: <span id="userPhone">লোড হচ্ছে...</span></p>
                <p>প্যাকেজ ফি: ৳<span id="userPackageFee">০</span></p>
            </div>
        </div>

        <!-- মোট আয় বক্স -->
        <div class="total-earn-box">
            <p>মোট আয়</p>
            <h2 id="userTotalEarned">0.00</h2>
        </div>

        <!-- ব্যালেন্স ও আয় সমূহ গ্রিড -->
        <div class="balance-grid">
            <div class="balance-box">
                <h4>টিম কমিশন</h4>
                <p id="userTeamCommission">0.00</p>
            </div>
            <div class="balance-box">
                <h4>আমন্ত্রণ আয়</h4>
                <p id="userInviteEarn">0.00</p>
            </div>
            <div class="balance-box">
                <h4>ডেইলি টাস্ক</h4>
                <p id="userTaskCash">0.00</p>
            </div>
            <div class="balance-box">
                <h4>আজকের টিম কমিশন</h4>
                <p id="userTodayTeamCommission">0.00</p>
            </div>
            <div class="balance-box dark-box">
                <h4>মাই ক্যাশ</h4>
                <p id="userBalance">0.00</p>
            </div>
            <div class="balance-box dark-box">
                <h4>টাস্ক ক্যাশ</h4>
                <p id="userTaskCashBox">0.00</p>
            </div>
        </div>

        <!-- মেনু লিঙ্কসমূহ -->
        <div class="menu-links">
            <a href="work-details.html" class="menu-item">কাজের বিবরণ</a>
            <a href="withdraw-record.html" class="menu-item">টাকা উত্তোলনের রেকর্ড</a>
            <a href="recharge-record.html" class="menu-item">রিচার্জ রেকর্ড</a>
            <a href="guideline.html" class="menu-item">কর্মী নির্দেশিকা</a>
        </div>

        <!-- লগআউট বাটন -->
        <div class="logout-container">
            <a href="#" id="logoutBtn" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i> লগআউট
            </a>
        </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // প্যাকেজ কোডের বিপরীতে সঠিক নাম এবং ফি ম্যাপিং (task.1 ফরম্যাট অনুযায়ী)
      const packageDetails = {
        "task.1": { name: "প্যাকেজ ১ (Task.1)", fee: 3000 },
        "task.2": { name: "প্যাকেজ ২ (Task.2)", fee: 4500 },
        "task.3": { name: "প্যাকেজ ৩ (Task.3)", fee: 6000 },
        "task.4": { name: "প্যাকেজ ৪ (Task.4)", fee: 7500 },
        // পুরনো নামগুলোর জন্যও ব্যাকআপ রাখা হলো যাতে সমস্যা না হয়
        "G.1": { name: "প্যাকেজ ১ (Task.1)", fee: 3000 },
        "G.2": { name: "প্যাকেজ ২ (Task.2)", fee: 4500 },
        "G.3": { name: "প্যাকেজ ৩ (Task.3)", fee: 6000 },
        "G.4": { name: "প্যাকেজ ৪ (Task.4)", fee: 7500 }
      };

      onAuthStateChanged(auth, (user) => {
        if (user) {
          const userRef = doc(db, "users", user.uid);

          // রিয়েল-টাইম লিসেনার (ডাটা পরিবর্তন হওয়া মাত্র প্রোফাইলে আপডেট হবে)
          onSnapshot(userRef, async (docSnap) => {
            if (docSnap.exists()) {
              const data = docSnap.data();

              // প্রতিদিন রাত ১২টায় বা নতুন দিনে আজকের টিম কমিশন রিসেট লজিক
              const lastResetDate = data.lastResetDate || "";
              const todayStr = new Date().toDateString();

              if (lastResetDate !== todayStr) {
                await updateDoc(userRef, {
                  todayTeamCommission: 0,
                  dailyTask: 0,
                  lastResetDate: todayStr
                });
                data.todayTeamCommission = 0;
                data.dailyTask = 0;
              }

              // ইউজারের তথ্য সেট করা
              document.getElementById("userName").innerText = data.name || data.userName || data.fullName || "নাম পাওয়া যায়নি";
              document.getElementById("userPhone").innerText = data.phone || data.userPhone || user.phoneNumber || "নম্বর নেই";

              // প্যাকেজ তথ্য সেট করা
              const userPkgKey = data.package || "";
              const pkgInfo = packageDetails[userPkgKey] || { name: "কোনো প্যাকেজ কেনা হয়নি", fee: 0 };

              document.getElementById("userPackageName").innerText = pkgInfo.name;
              document.getElementById("userPackageFee").innerText = pkgInfo.fee;

              // ব্যালেন্স ও ক্যাশ আপডেট
              const myCash = Number(data.myCash || 0).toFixed(2);
              const taskCash = Number(data.taskCash || 0).toFixed(2);
              const dailyTask = Number(data.dailyTask || data.dailyTaskIncome || 0).toFixed(2);

              document.getElementById("userBalance").innerText = myCash;
              document.getElementById("userTaskCashBox").innerText = taskCash;
              document.getElementById("userTaskCash").innerText = dailyTask;

              // অন্যান্য আয় ও কমিশন
              document.getElementById("userTeamCommission").innerText = Number(data.teamCommission || 0).toFixed(2);
              document.getElementById("userInviteEarn").innerText = Number(data.inviteEarn || 0).toFixed(2);
              document.getElementById("userTodayTeamCommission").innerText = Number(data.todayTeamCommission || 0).toFixed(2);
              document.getElementById("userTotalEarned").innerText = Number(data.totalEarned || 0).toFixed(2);

            } else {
              console.log("ইউজার ডাটাবেসে পাওয়া যায়নি!");
            }
          });
        } else {
          window.location.href = "login.html";
        }
      });

      // লগআউট হ্যান্ডলার
      document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault();
        signOut(auth).then(() => {
          window.location.href = "login.html";
        }).catch((error) => {
          console.error("লগআউট করতে সমস্যা হয়েছে:", error);
        });
      });
    </script>
</body>
</html>
