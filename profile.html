<!-- Profile Data & Balance Loader Script -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
    authDomain: "taskora-b2b29.firebaseapp.com",
    projectId: "taskora-b2b29",
    storageBucket: "taskora-b2b29.firebasestorage.app",
    messagingSenderId: "376297360134",
    appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
    measurementId: "G-9803M7DPM5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ইউজারের লগইন স্ট্যাটাস ও ডাটা লোড
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          const userData = userDoc.data();
          
          // আপনার প্রোফাইল পেজের এইচটিএমএল এলিমেন্টে ডাটা বসানো
          if (document.getElementById('profileName')) {
            document.getElementById('profileName').innerText = userData.name || "ইউজার";
          }
          if (document.getElementById('profilePhone')) {
            document.getElementById('profilePhone').innerText = userData.phone || "";
          }
          if (document.getElementById('profileBalance')) {
            document.getElementById('profileBalance').innerText = (userData.balance || 0) + " ৳";
          }
          if (document.getElementById('profilePackage')) {
            document.getElementById('profilePackage').innerText = userData.package || "কোনো প্যাকেজ নেই";
          }
        }
      } catch (error) {
        console.error("ডাটা লোড করতে সমস্যা হয়েছে:", error);
      }
    } else {
      // লগইন না থাকলে লগইন পেজে রিডাইরেক্ট
      window.location.href = "login.html";
    }
  });

  // যদি প্রোফাইল পেজে কোনো লগআউট বাটন থাকে
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    });
  }
</script>
    
</body>
