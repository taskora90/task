<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-banner">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>আমার অ্যাকাউন্ট</h2>
    </header>

    <div class="profile-container">
        <div class="user-info-card">
            <div class="avatar-box">
                <i class="fa-solid fa-user-circle"></i>
                <span class="badge" id="profileBadge">G.1</span>
            </div>
            <div class="user-details">
                <p>নাম: <span id="profileName">লোড হচ্ছে...</span></p>
                <p>প্যাকেজ: <span id="profilePackage">লোড হচ্ছে...</span></p>
                <p>হিসাব (ফোন): <span id="profilePhone">লোড হচ্ছে...</span></p>
            </div>
        </div>

        <div class="total-income-card">
            <p>মোট আয়</p>
            <h3 id="profileBalance">0.00 ৳</h3>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span>টিম কমিশন</span>
                <strong id="teamCommission">0.00</strong>
            </div>
            <div class="stat-item">
                <span>আমন্ত্রণ আয়</span>
                <strong id="inviteIncome">0.00</strong>
            </div>
            <div class="stat-item">
                <span>ডেইলি টাস্ক</span>
                <strong id="dailyTaskCount">0</strong>
            </div>
            <div class="stat-item">
                <span>আজকের টিম কমিশন</span>
                <strong id="todayTeamCommission">0</strong>
            </div>
        </div>

        <div class="wallet-cards">
            <div class="wallet-item">
                <p>মাই ক্যাশ</p>
                <strong id="myCash">0.00 ৳</strong>
            </div>
            <div class="wallet-item">
                <p>টাস্ক ক্যাশ</p>
                <strong id="taskCash">0.00 ৳</strong>
            </div>
        </div>

        <!-- কাজের বিবরণ সেকশন এবং তালিকা দেখানোর জন্য মডাল বা বক্স -->
        <button class="nav-links" id="taskDetailsBtn">কাজের বিবরণ</button>
        <div id="taskHistoryContainer" style="display:none; background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd;">
            <h4 style="margin-top: 0; color: #333;">আজকের কাজের বিবরণ</h4>
            <div id="taskHistoryList">কোনো কাজ সম্পন্ন হয়নি</div>
        </div>

        <button type="button" class="nav-links" onclick="location.href='withdraw-record.html'">
            টাকা উত্তোলনের রেকর্ড
        </button>
        <button class="nav-links" onclick="alert('কর্মী নির্দেশিকা')">কর্মী নির্দেশিকা</button>
        <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>হোম</span>
        </a>
        <a href="task.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>টাস্ক</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-users"></i>
            <span>টিম</span>
        </a>
        <a href="package.html" class="nav-item">
            <i class="fa-solid fa-box"></i>
            <span>প্যাকেজ</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>প্রোফাইল</span>
        </a>
    </nav>

    <!-- Profile Data & Guard Script -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          try {
            const userDocRef = doc(db, "users", user.uid);
            const userDoc = await getDoc(userDocRef);

            if (userDoc.exists()) {
              const userData = userDoc.data();
              
              // ১. ইউজার ইনফো
              if (document.getElementById('profileName')) document.getElementById('profileName').innerText = userData.name || "ইউজার";
              if (document.getElementById('profilePhone')) document.getElementById('profilePhone').innerText = userData.phone || "";
              if (document.getElementById('profilePackage')) document.getElementById('profilePackage').innerText = userData.package || "কোনো প্যাকেজ নেই";

              // ২. মোট আয় (lifetime additive counter)
              const totalIncome = userData.totalEarned || 0;
              if (document.getElementById('profileBalance')) document.getElementById('profileBalance').innerText = totalIncome + " ৳";

              // ৩. স্ট্যাটস গ্রিড ডেটা
              if (document.getElementById('teamCommission')) document.getElementById('teamCommission').innerText = userData.teamCommission || "0.00";
              if (document.getElementById('inviteIncome')) document.getElementById('inviteIncome').innerText = userData.inviteIncome || "0.00";
              if (document.getElementById('dailyTaskCount')) document.getElementById('dailyTaskCount').innerText = userData.dailyTaskCount || "0";
              if (document.getElementById('todayTeamCommission')) document.getElementById('todayTeamCommission').innerText = userData.todayTeamCommission || "0";

              // ৪. মাই ক্যাশ (শুধুমাত্র রিচার্জের টাকা)
              if (document.getElementById('myCash')) document.getElementById('myCash').innerText = (userData.balance || 0) + " ৳";

              // ৫. টাস্ক ক্যাশ (উইথড্র করার জন্য ব্যবহৃত সক্রিয় ব্যালেন্স)
              if (document.getElementById('taskCash')) document.getElementById('taskCash').innerText = (userData.taskCash || 0) + " ৳";
            }

            // ৬. কাজের বিবরণ বা টাস্ক হিস্ট্রি লোড করার লজিক
            const taskHistoryRef = collection(db, "users", user.uid, "taskHistory");
            const historySnap = await getDocs(taskHistoryRef);
            const historyListEl = document.getElementById('taskHistoryList');

            if (!historySnap.empty) {
              let htmlContent = "";
              let count = 1;
              historySnap.forEach((docSnap) => {
                const data = docSnap.data();
                // ধরে নিচ্ছি প্রতিটি টাস্ক ডকুমেন্টে amount বা reward এবং taskName বা similar ফিল্ড আছে
                const reward = data.reward || data.amount || 10; 
                htmlContent += `<p style="margin: 5px 0; font-size: 14px; border-bottom: 1px dashed #eee; padding-bottom: 4px;">কাজ #${count++}: সফলভাবে সম্পন্ন হয়েছে (+${reward} ৳)</p>`;
              });
              historyListEl.innerHTML = htmlContent;
            }

          } catch (error) {
            console.error("ডাটা আনতে সমস্যা হয়েছে:", error);
          }
        } else {
          window.location.href = "login.html";
        }
      });

      // কাজের বিবরণ টগল করার বাটন ইভেন্ট
      const taskDetailsBtn = document.getElementById('taskDetailsBtn');
      const taskHistoryContainer = document.getElementById('taskHistoryContainer');
      if (taskDetailsBtn) {
        taskDetailsBtn.addEventListener('click', () => {
          if (taskHistoryContainer.style.display === "none") {
            taskHistoryContainer.style.display = "block";
          } else {
            taskHistoryContainer.style.display = "none";
          }
        });
      }

      // লগআউট হ্যান্ডলার
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          signOut(auth).then(() => {
            window.location.href = "login.html";
          });
        });
      }
    </script>
</body>
</html>
