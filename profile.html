<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- আপনার আগের প্রোফাইল ডিজাইন স্ট্রাকচার অনুযায়ী -->
    <div class="profile-container">
        <div class="user-header">
            <h2><i class="fa-solid fa-user-circle"></i> প্রোফাইল</h2>
            <p id="userEmail" style="color: #6c757d; font-size: 14px;"></p>
        </div>

        <div class="balance-box">
            <div class="balance-item"><span>মূল ব্যালেন্স (My Cash):</span> <strong id="myCash">৳ 0</strong></div>
            <div class="balance-item"><span>টাস্ক ক্যাশ (Task Cash):</span> <strong id="taskCash">৳ 0</strong></div>
            <div class="balance-item"><span>সর্বমোট আয় (Total Earned):</span> <strong id="totalEarned" style="color: #28a745;">৳ 0</strong></div>
            <div class="balance-item"><span>সক্রিয় প্যাকেজ:</span> <strong id="userPackage" style="color: #007bff;">কোনোটিই নেই</strong></div>
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <a href="withdraw.html" class="btn" style="display: inline-block; background-color: #28a745; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold;">টাকা উত্তোলন করুন</a>
        </div>

        <div class="section-title">কাজের বিবরণ (আজকের ইতিহাস)</div>
        <div class="record-list" id="taskHistoryList">
            <div class="record-item">কোনো কাজ সম্পন্ন হয়নি</div>
        </div>

        <div class="section-title">টাকা উত্তোলনের রেকর্ড</div>
        <div class="record-list" id="withdrawHistoryList">
            <div class="record-item">কোনো উত্তোলন রেকর্ড নেই</div>
        </div>
    </div>

    <!-- নেভিগেশন বার -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="task.html" class="nav-item"><i class="fa-solid fa-list-check"></i><span>টাস্ক</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-users"></i><span>টিম</span></a>
        <a href="package.html" class="nav-item"><i class="fa-solid fa-box"></i><span>প্যাকেজ</span></a>
        <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          document.getElementById('userEmail').innerText = user.email;

          // ইউজারের ব্যালেন্স এবং প্যাকেজ ডেটা আনা
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            document.getElementById('myCash').innerText = `৳ ${data.balance || 0}`;
            document.getElementById('taskCash').innerText = `৳ ${data.taskCash || 0}`;
            document.getElementById('totalEarned').innerText = `৳ ${data.totalEarned || 0}`;
            document.getElementById('userPackage').innerText = data.package || "কোনোটিই নেই";
          }

          // কাজের বিবরণ (Task History) লোড করা
          const taskListEl = document.getElementById('taskHistoryList');
          const taskQuery = query(collection(db, "taskHistory"), where("userId", "==", user.uid));
          const taskSnap = await getDocs(taskQuery);
          if (!taskSnap.empty) {
            taskListEl.innerHTML = "";
            taskSnap.forEach((doc) => {
              const tData = doc.data();
              taskListEl.innerHTML += `<div class="record-item">কাজ নং ${tData.taskNo}: ৳${tData.reward} অর্জিত হয়েছে (${tData.time})</div>`;
            });
          }

          // উত্তোলনের রেকর্ড (Withdrawal History) লোড করা
          const withdrawListEl = document.getElementById('withdrawHistoryList');
          const withdrawQuery = query(collection(db, "withdrawals"), where("userId", "==", user.uid));
          const withdrawSnap = await getDocs(withdrawQuery);
          if (!withdrawSnap.empty) {
            withdrawListEl.innerHTML = "";
            withdrawSnap.forEach((doc) => {
              const wData = doc.data();
              let statusText = wData.status;
              if(wData.status === 'waiting') statusText = 'Waiting (অপেক্ষমান)';
              else if(wData.status === 'processing') statusText = 'Bank Processing (প্রসেসিং)';
              else if(wData.status === 'approved') statusText = 'সফল (Approved)';
              else if(wData.status === 'rejected') statusText = 'বাতিল (Rejected)';

              withdrawListEl.innerHTML += `<div class="record-item">পরিমাণ: ৳${wData.amount} | স্ট্যাটাস: <strong>${statusText}</strong></div>`;
            });
          }
        } else {
          window.location.href = "login.html";
        }
      });
    </script>
</body>
</html>
