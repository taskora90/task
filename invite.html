<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমন্ত্রণ - Invite Friends</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f5f7;
      color: #2e3440;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 95vh;
    }
    .container {
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      background: #fff;
      padding: 18px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
      border-top: 4px solid #4c566a;
      box-sizing: border-box;
    }
    .header h2 {
      color: #2e3440;
      margin-bottom: 5px;
      font-size: 18px;
    }
    .header p {
      color: #4c566a;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .referral-box {
      background: #f8f9fa;
      border: 1px dashed #4c566a;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
    }
    .ref-code {
      font-size: 20px;
      font-weight: bold;
      color: #3b4252;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    .input-group input {
      flex: 1;
      padding: 8px;
      border: 1px solid #d8dee9;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
      color: #4c566a;
    }
    .copy-btn {
      background: #3b4252;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: background 0.2s;
    }
    .copy-btn:hover {
      background: #434c5e;
    }

    /* সোশ্যাল শেয়ার বাটন স্টাইল */
    .share-title {
      font-size: 12px;
      color: #4c566a;
      margin: 10px 0 6px 0;
      font-weight: 600;
    }
    .share-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
    }
    .share-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 5px;
      border-radius: 6px;
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .share-btn:hover {
      opacity: 0.9;
    }
    .btn-whatsapp { background-color: #25D366; }
    .btn-telegram { background-color: #0088cc; }
    .btn-messenger { background-color: #0084FF; }

    /* তিনটি ছোট ব্যানার এড স্লট কন্টেইনার */
    .ads-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 10px 0;
    }
    .ad-banner-container {
      padding: 6px;
      background: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #e5e9f0;
      text-align: center;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .back-btn {
      display: inline-block;
      margin-top: 8px;
      color: #4c566a;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><i class="fa-solid fa-users"></i> বন্ধুদের আমন্ত্রণ জানান</h2>
      <p>আপনার রেফারেল লিংক শেয়ার করে বন্ধুদের অ্যাকাউন্ট খোলাতে সাহায্য করুন।</p>
    </div>

    <div class="referral-box">
      <div style="font-size: 12px; color: #4c566a; margin-bottom: 4px;">আপনার রেফারেল কোড:</div>
      <div class="ref-code" id="userRefCode">---</div>

      <div class="input-group">
        <input type="text" id="refLink" readonly value="লিংক লোড হচ্ছে...">
        <button class="copy-btn" onclick="copyLink()"><i class="fa-solid fa-copy"></i> কপি</button>
      </div>
    </div>

    <!-- সরাসরি শেয়ারিং অপশন (WhatsApp, Telegram, Messenger) -->
    <div class="share-title">সরাসরি শেয়ার করুন:</div>
    <div class="share-buttons">
      <button class="share-btn btn-whatsapp" onclick="shareWhatsApp()"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
      <button class="share-btn btn-telegram" onclick="shareTelegram()"><i class="fa-brands fa-telegram"></i> Telegram</button>
      <button class="share-btn btn-messenger" onclick="shareMessenger()"><i class="fa-brands fa-facebook-messenger"></i> Messenger</button>
    </div>

    <!-- এক সাথে ৩টি ছোট ব্যানার অ্যাড স্লট -->
    <div class="ads-wrapper">
      <!-- ব্যানার স্লট ১ -->
      <div class="ad-banner-container">
        <!-- এখানে আপনার ১ম Monetag ব্যানার অ্যাড স্ক্রিপ্ট পেস্ট করবেন -->
        <span style="font-size: 11px; color: #a0aec0;">[ ব্যানার অ্যাড ১ ]</span>
      </div>

      <!-- ব্যানার স্লট ২ -->
      <div class="ad-banner-container">
        <!-- এখানে আপনার ২য় Monetag ব্যানার অ্যাড স্ক্রিপ্ট পেস্ট করবেন -->
        <span style="font-size: 11px; color: #a0aec0;">[ ব্যানার অ্যাড ২ ]</span>
      </div>

      <!-- ব্যানার স্লট ৩ -->
      <div class="ad-banner-container">
        <!-- এখানে আপনার ৩য় Monetag ব্যানার অ্যাড স্ক্রিপ্ট পেস্ট করবেন -->
        <span style="font-size: 11px; color: #a0aec0;">[ ব্যানার অ্যাড ৩ ]</span>
      </div>
    </div>

    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
      authDomain: "taskora-b2b29.firebaseapp.com",
      projectId: "taskora-b2b29",
      storageBucket: "taskora-b2b29.firebasestorage.app",
      messagingSenderId: "376297360134",
      appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
      measurementId: "G-9803M7DPM5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let fullInviteLink = "";

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const userRef = doc(db, "users", user.uid);
          const userSnap = await getDoc(userRef);

          if (userSnap.exists()) {
            let userData = userSnap.data();
            let currentUserCode = userData.referralCode;

            if (!currentUserCode) {
              currentUserCode = 'REF' + Math.floor(100000 + Math.random() * 900000);
              await setDoc(userRef, { referralCode: currentUserCode }, { merge: true });
            }

            document.getElementById('userRefCode').innerText = currentUserCode;

            const baseUrl = window.location.origin + window.location.pathname.replace('invite.html', 'register.html');
            fullInviteLink = baseUrl + '?ref=' + currentUserCode;

            document.getElementById('refLink').value = fullInviteLink;
          }
        } catch (error) {
          console.error("ডেটা লোড করতে সমস্যা হয়েছে:", error);
        }
      } else {
        window.location.href = "login.html";
      }
    });

    window.copyLink = function() {
      const linkInput = document.getElementById('refLink');
      linkInput.select();
      linkInput.setSelectionRange(0, 99999); 
      navigator.clipboard.writeText(linkInput.value);
      alert('রেফারেল লিংক কপি করা হয়েছে!');
    }

       // সোশ্যাল শেয়ারিং ফাংশন (ওয়েব ভিউ এবং ব্রাউজার ফ্রেন্ডলি)
    window.shareWhatsApp = function() {
      if(!fullInviteLink) return;
      const text = encodeURIComponent(`TaskOra অ্যাপে যোগ দিন এবং প্রতিদিন ইনকাম করুন! আমার রেফারেল লিংক: ${fullInviteLink}`);
      window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }

    window.shareTelegram = function() {
      if(!fullInviteLink) return;
      const text = encodeURIComponent(`TaskOra অ্যাপে যোগ দিন এবং কাজ করে আয় করুন!`);
      window.open(`https://t.me/share/url?url=${encodeURIComponent(fullInviteLink)}&text=${text}`, '_blank');
    }

    window.shareMessenger = function() {
      if(!fullInviteLink) return;
      // ফেসবুকের অফিসিয়াল ওয়েব শেয়ার লিংক (WebView এরর মুক্ত)
      const fbShareUrl = `https://www.facebook.com/dialog/send?link=${encodeURIComponent(fullInviteLink)}&app_id=291494419107518&redirect_uri=${encodeURIComponent(fullInviteLink)}`;
      window.open(fbShareUrl, '_blank');
    }

  </script>

</body>
</html>
