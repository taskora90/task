<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমন্ত্রণ - Invite Friends</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f5f7;
      color: #2e3440;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 450px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
      border-top: 4px solid #4c566a;
    }
    .header h2 {
      color: #2e3440;
      margin-bottom: 8px;
      font-size: 20px;
    }
    .header p {
      color: #4c566a;
      font-size: 13px;
    }
    .referral-box {
      background: #f8f9fa;
      border: 1px dashed #4c566a;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
    }
    .ref-code {
      font-size: 22px;
      font-weight: bold;
      color: #3b4252;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    .input-group input {
      flex: 1;
      padding: 10px;
      border: 1px solid #d8dee9;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: #4c566a;
    }
    .copy-btn {
      background: #3b4252;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.2s;
    }
    .copy-btn:hover {
      background: #434c5e;
    }
    .back-btn {
      display: inline-block;
      margin-top: 15px;
      color: #4c566a;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><i class="fa-solid fa-users"></i> বন্ধুদের আমন্ত্রণ জানান</h2>
      <p>আপনার রেফারেল লিংক শেয়ার করে বন্ধুদের অ্যাকাউন্ট খোলাতে সাহায্য করুন।</p>
    </div>

    <div class="referral-box">
      <div style="font-size: 13px; color: #4c566a; margin-bottom: 5px;">আপনার রেফারেল কোড:</div>
      <div class="ref-code" id="userRefCode">---</div>

      <div class="input-group">
        <input type="text" id="refLink" readonly value="লিংক লোড হচ্ছে...">
        <button class="copy-btn" onclick="copyLink()"><i class="fa-solid fa-copy"></i> কপি</button>
      </div>
    </div>

    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
      authDomain: "taskora-b2b29.firebaseapp.com",
      projectId: "taskora-b2b29",
      storageBucket: "taskora-b2b29.firebasestorage.app",
      messagingSenderId: "376297360134",
      appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
      measurementId: "G-9803M7DPM5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const userRef = doc(db, "users", user.uid);
          const userSnap = await getDoc(userRef);

          if (userSnap.exists()) {
            let userData = userSnap.data();
            let currentUserCode = userData.referralCode;

            if (!currentUserCode) {
              currentUserCode = 'REF' + Math.floor(100000 + Math.random() * 900000);
              await setDoc(userRef, { referralCode: currentUserCode }, { merge: true });
            }

            document.getElementById('userRefCode').innerText = currentUserCode;

            const baseUrl = window.location.origin + window.location.pathname.replace('invite.html', 'register.html');
            const fullInviteLink = baseUrl + '?ref=' + currentUserCode;

            document.getElementById('refLink').value = fullInviteLink;
          }
        } catch (error) {
          console.error("ডেটা লোড করতে সমস্যা হয়েছে:", error);
        }
      } else {
        window.location.href = "login.html";
      }
    });

    window.copyLink = function() {
      const linkInput = document.getElementById('refLink');
      linkInput.select();
      linkInput.setSelectionRange(0, 99999); 
      navigator.clipboard.writeText(linkInput.value);
      alert('রেফারেল লিংক কপি করা হয়েছে!');
    }
  </script>

</body>
</html>
