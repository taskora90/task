<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার টিম</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px 20px 80px 20px; }
        .team-container { max-width: 450px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .team-header { text-align: center; margin-bottom: 20px; }
        
        .stats-grid { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #eef2f5; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-card h3 { margin: 0 0 5px 0; font-size: 16px; color: #333; }
        .stat-card p { margin: 0; font-size: 18px; font-weight: bold; color: #007bff; }

        .level-section { margin-bottom: 25px; }
        .level-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #495057; border-bottom: 2px solid #e9ecef; padding-bottom: 5px; }
        
        .member-card { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .member-info span { display: block; color: #6c757d; font-size: 12px; }
        .no-member { text-align: center; color: #888; font-size: 14px; padding: 10px; background: #fdfdfd; border-radius: 6px; border: 1px dashed #ddd; }
    </style>
</head>
<body>

    <div class="team-container">
        <div class="team-header">
            <h2><i class="fa-solid fa-users"></i> আমার টিম</h2>
            <p style="font-size: 13px; color: #6c757d;">আপনার রেফারেল ও টিম কমিশন ওভারভিউ</p>
        </div>

        <!-- সামারি কার্ড -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>লেভেল ১ মেম্বার</h3>
                <p id="level1Count">0</p>
            </div>
            <div class="stat-card">
                <h3>লেভেল ২ মেম্বার</h3>
                <p id="level2Count">0</p>
            </div>
        </div>

        <!-- লেভেল ১ লিস্ট -->
        <div class="level-section">
            <div class="level-title"><i class="fa-solid fa-user-plus"></i> লেভেল ১ (সরাসরি রেফার)</div>
            <div id="level1List">
                <div class="no-member">লোড হচ্ছে...</div>
            </div>
        </div>

        <!-- লেভেল ২ লিস্ট -->
        <div class="level-section">
            <div class="level-title"><i class="fa-solid fa-users-viewfinder"></i> লেভেল ২ (পরোক্ষ রেফার)</div>
            <div id="level2List">
                <div class="no-member">লোড হচ্ছে...</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="task.html" class="nav-item"><i class="fa-solid fa-list-check"></i><span>টাস্ক</span></a>
        <a href="team.html" class="nav-item active"><i class="fa-solid fa-users"></i><span>টিম</span></a>
        <a href="package.html" class="nav-item"><i class="fa-solid fa-box"></i><span>প্যাকেজ</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          try {
            const userDocRef = doc(db, "users", user.uid);
            const userDoc = await getDoc(userDocRef);
            
            if (!userDoc.exists()) return;
            const userData = userDoc.data();
            const myReferralCode = userData.referralCode;

            if (!myReferralCode) {
              document.getElementById('level1List').innerHTML = '<div class="no-member">রেফারেল কোড পাওয়া যায়নি।</div>';
              document.getElementById('level2List').innerHTML = '<div class="no-member">রেফারেল কোড পাওয়া যায়নি।</div>';
              return;
            }

            // লেভেল ১ কুয়েরি (যাদের `referredBy` আপনার রেফারেল কোডের সমান)
            const qLevel1 = query(collection(db, "users"), where("referredBy", "==", myReferralCode));
            const querySnapshot1 = await getDocs(qLevel1);

            let level1Users = [];
            let level1Codes = [];
            
            querySnapshot1.forEach((doc) => {
              const data = doc.data();
              level1Users.push(data);
              if (data.referralCode) {
                level1Codes.push(data.referralCode);
              }
            });

            document.getElementById('level1Count').innerText = level1Users.length;

            const level1ListEl = document.getElementById('level1List');
            if (level1Users.length === 0) {
              level1ListEl.innerHTML = '<div class="no-member">কোনো লেভেল ১ মেম্বার নেই।</div>';
            } else {
              let html1 = '';
              level1Users.forEach(member => {
                html1 += `
                  <div class="member-card">
                      <div class="member-info">
                          <strong>${member.name || 'নামবিহীন'}</strong>
                          <span>ফোন: ${member.phone || 'নেই'}</span>
                      </div>
                      <div>প্যাকেজ: <strong>${member.package || 'নিষ্ক্রিয়'}</strong></div>
                  </div>
                `;
              });
              level1ListEl.innerHTML = html1;
            }

            // লেভেল ২ কুয়েরি (যাদের `referredBy` লেভেল ১ মেম্বারদের রেফারেল কোডের কোনো একটির সমান)
            let level2Users = [];
            if (level1Codes.length > 0) {
              // Firestore 'in' কুয়েরি সর্বোচ্চ ১০টি আইটেম সাপোর্ট করে, সেহেতু লুপ বা একসাথে চেক করা যায়। আপাতত লেভেল ১ কোডগুলোর জন্য ফেচ করছি।
              for (let code of level1Codes) {
                const qLevel2 = query(collection(db, "users"), where("referredBy", "==", code));
                const querySnapshot2 = await getDocs(qLevel2);
                querySnapshot2.forEach((doc) => {
                  level2Users.push(doc.data());
                });
              }
            }

            document.getElementById('level2Count').innerText = level2Users.length;

            const level2ListEl = document.getElementById('level2List');
            if (level2Users.length === 0) {
              level2ListEl.innerHTML = '<div class="no-member">কোনো লেভেল ২ মেম্বার নেই।</div>';
            } else {
              let html2 = '';
              level2Users.forEach(member => {
                html2 += `
                  <div class="member-card">
                      <div class="member-info">
                          <strong>${member.name || 'নামবিহীন'}</strong>
                          <span>ফোন: ${member.phone || 'নেই'}</span>
                      </div>
                      <div>প্যাকেজ: <strong>${member.package || 'নিষ্ক্রিয়'}</strong></div>
                  </div>
                `;
              });
5level2ListEl.innerHTML = html2;
            }

          } catch (error) {
            console.error("টিম ডাটা লোড করতে সমস্যা হয়েছে:", error);
          }
        } else {
          window.location.href = "login.html";
        }
      });
    </script>
</body>
</html>
