<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার টিম</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(180deg, #eef2f6 0%, #f8fafc 100%); margin: 0; padding: 20px 20px 85px 20px; color: #2e3440; }
        .team-container { max-width: 450px; margin: 0 auto; background: linear-gradient(180deg, #ffffff 0%, #fbfcfd 100%); padding: 20px; border-radius: 14px; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06); border: 1px solid #e2e8f0; }
        .team-header { text-align: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #eef2f6; }
        .team-header h2 { margin: 0 0 4px 0; color: #1e293b; font-size: 21px; }

        /* মোট রেফার আয় কার্ড স্টাইল */
        .total-referral-card { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; border: 1px solid #cbd5e1; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04); }
        .total-referral-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #475569; }
        .total-referral-card p { margin: 0; font-size: 21px; font-weight: bold; color: #15803d; }

        /* মাসিক ভাতা ঘর স্টাইল (সক্রিয় হওয়ার আগে অ্যাশ কালার ও নিষ্ক্রিয় টাচ) */
        .monthly-allowance-card { display: block; background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); border: 1px solid #94a3b8; border-left: 4px solid #64748b; padding: 14px 16px; border-radius: 10px; text-align: center; margin-bottom: 15px; cursor: default; user-select: none; box-shadow: inset 0 1px 2px rgba(255,255,255,0.6); transition: all 0.25s ease; }
        .monthly-allowance-card p { margin: 0; font-size: 17px; font-weight: bold; color: #334155; }

        /* মাসিক ভাতা সক্রিয় হলে সবুজ স্টাইল ও ক্লিকযোগ্য ইফেক্ট */
        .monthly-allowance-card.allowance-unlocked { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); border-color: #15803d; border-left: 4px solid #14532d; cursor: pointer; box-shadow: 0 6px 14px rgba(22, 163, 74, 0.28); }
        .monthly-allowance-card.allowance-unlocked p { color: #ffffff; }
        .monthly-allowance-card.allowance-unlocked:hover { background: linear-gradient(135deg, #15803d 0%, #166534 100%); transform: translateY(-1px); }

        .stats-grid { display: flex; gap: 10px; margin-bottom: 22px; }
        .stat-card { flex: 1; background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%); padding: 15px 10px; border-radius: 10px; text-align: center; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03); }
        .stat-card h3 { margin: 0 0 6px 0; font-size: 14px; color: #475569; }
        .stat-card p { margin: 0; font-size: 19px; font-weight: bold; color: #0284c7; }

        .level-section { margin-bottom: 24px; }
        .level-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: #334155; background: #f1f5f9; border-left: 3px solid #3b4252; padding: 7px 10px; border-radius: 6px; }

        .member-card { background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%); border: 1px solid #e2e8f0; border-radius: 8px; padding: 11px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; box-shadow: 0 2px 4px rgba(15, 23, 42, 0.03); }
        .member-info span { display: block; color: #64748b; font-size: 12px; margin-top: 2px; }
        .no-member { text-align: center; color: #64748b; font-size: 13px; padding: 12px; background: #f8fafc; border-radius: 8px; border: 1px dashed #cbd5e1; }
    </style>
</head>
<body>

    <div class="team-container">
        <div class="team-header">
            <h2><i class="fa-solid fa-users"></i> আমার টিম</h2>
            <p style="font-size: 13px; color: #64748b; margin: 0;">আপনার রেফারেল ও টিম কমিশন ওভারভিউ</p>
        </div>

        <!-- মোট রেফার আয় বক্স (শুধুমাত্র প্যাকেজ ক্রয়ের ১০% কমিশন) -->
        <div class="total-referral-card">
            <h3>মোট রেফার আয় (প্যাকেজ কমিশন)</h3>
            <p id="totalReferralIncome">৳ 0.00</p>
        </div>

        <!-- সবসময় দৃশ্যমান মাসিক ভাতা ঘর (সক্রিয় হওয়ার আগে অ্যাশ কালার ও নিষ্ক্রিয়; সক্রিয় হলে সবুজ ও salary.html-এ যাবে) -->
        <div class="monthly-allowance-card" id="monthlyAllowanceBox">
            <p id="monthlyAllowanceText">মাসিক ভাতা = ৳ 0</p>
        </div>

        <!-- সামারি কার্ড (লেভেল ১ ও লেভেল ২ মেম্বার সংখ্যা) -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>লেভেল ১ মেম্বার</h3>
                <p id="level1Count">0</p>
            </div>
            <div class="stat-card">
                <h3>লেভেল ২ মেম্বার</h3>
                <p id="level2Count">0</p>
            </div>
        </div>

        <!-- লেভেল ১ লিস্ট -->
        <div class="level-section">
            <div class="level-title"><i class="fa-solid fa-user-plus"></i> লেভেল ১ (সরাসরি রেফার)</div>
            <div id="level1List">
                <div class="no-member">লোড হচ্ছে...</div>
            </div>
        </div>

        <!-- লেভেল ২ লিস্ট -->
        <div class="level-section">
            <div class="level-title"><i class="fa-solid fa-users-viewfinder"></i> লেভেল ২ (পরোক্ষ রেফার)</div>
            <div id="level2List">
                <div class="no-member">লোড হচ্ছে...</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="task.html" class="nav-item"><i class="fa-solid fa-list-check"></i><span>টাস্ক</span></a>
        <a href="team.html" class="nav-item active"><i class="fa-solid fa-users"></i><span>টিম</span></a>
        <a href="package.html" class="nav-item"><i class="fa-solid fa-box"></i><span>প্যাকেজ</span></a>
        <a href="profile.html" class="nav-item"><i class="phase-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const defaultTiers = [
        { minRef: 100, amount: 20000 },
        { minRef: 80,  amount: 15000 },
        { minRef: 60,  amount: 10000 },
        { minRef: 40,  amount: 8500 },
        { minRef: 28,  amount: 6200 },
        { minRef: 20,  amount: 4000 },
        { minRef: 12,  amount: 2000 }
      ];

      // ইউজার প্যাকেজ কিনেছে কি না তা যাচাই করার হেল্পার ফাংশন ("none" থাকলে নিষ্ক্রিয় ধরা হবে)
      function hasActivePackage(member) {
        const pkgVal = (member.package || member.packageId || "").toString().trim().toLowerCase();
        if (!pkgVal) return false;
        const inactiveValues = ["none", "free", "নিষ্ক্রিয়", "null", "undefined", "false", "0"];
        return !inactiveValues.includes(pkgVal);
      }

      function renderMonthlyAllowance(paidDirectReferCount, tiersList = defaultTiers, adminSalary = 0) {
        const allowanceBox = document.getElementById('monthlyAllowanceBox');
        const allowanceText = document.getElementById('monthlyAllowanceText');
        if (!allowanceBox || !allowanceText) return;

        const tiers = [...(tiersList && tiersList.length > 0 ? tiersList : defaultTiers)]
          .sort((a, b) => Number(b.minRef) - Number(a.minRef));

        const matchedTier = tiers.find(t => paidDirectReferCount >= Number(t.minRef));
        const tierAllowance = matchedTier ? Number(matchedTier.amount) : 0;
        const customSalary = Number(adminSalary || 0);
        const currentAmount = customSalary > 0 ? customSalary : tierAllowance;

        allowanceBox.style.display = 'block';

        if (currentAmount > 0) {
          allowanceText.innerHTML = `মাসিক ভাতা = ৳ ${currentAmount} <span style="display:block; font-size:12px; font-weight:normal; margin-top:3px; opacity:0.95;">ক্লিক করুন →</span>`;
          allowanceBox.classList.add('allowance-unlocked');
          allowanceBox.onclick = () => {
            window.location.href = 'salary.html';
          };
        } else {
          allowanceText.innerText = `মাসিক ভাতা = ৳ 0`;
          allowanceBox.classList.remove('allowance-unlocked');
          allowanceBox.onclick = null;
        }
      }

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          try {
            const userDocRef = doc(db, "users", user.uid);
            const userDoc = await getDoc(userDocRef);

            if (!userDoc.exists()) return;
            const userData = userDoc.data();
            const myReferralCode = userData.referralCode;
            const adminSalary = Number(userData.monthlySalary || 0);

            // অ্যাডমিন প্যানেল থেকে সেভ করা মাসিক ভাতা ধাপসমূহ লোড করা
            let configuredTiers = defaultTiers;
            try {
              const tierDocSnap = await getDoc(doc(db, "admin_settings", "monthly_salary_tiers"));
              if (tierDocSnap.exists() && Array.isArray(tierDocSnap.data().tiers) && tierDocSnap.data().tiers.length > 0) {
                configuredTiers = tierDocSnap.data().tiers;
              }
            } catch (tierErr) {
              console.error("মাসিক ভাতা ধাপ লোড করতে সমস্যা:", tierErr);
            }

            if (!myReferralCode) {
              document.getElementById('level1List').innerHTML = '<div class="no-member">রেফারেল কোড পাওয়া যায়নি।</div>';
              document.getElementById('level2List').innerHTML = '<div class="no-member">রেফারেল কোড পাওয়া যায়নি।</div>';
              renderMonthlyAllowance(0, configuredTiers, adminSalary);
              return;
            }

            // ১. ফায়ারবেস থেকে ইউজারের referralHistory সাব কালেকশন ফেচ করে শুধুমাত্র প্যাকেজ ক্রয়ের কমিশন যোগ করা
            let totalPackageRefIncome = 0;
            try {
              const refHistoryRef = collection(db, "users", user.uid, "referralHistory");
              const refHistorySnap = await getDocs(refHistoryRef);
              refHistorySnap.forEach((hDoc) => {
                const hData = hDoc.data();
                if (hData.title && (hData.title.includes("প্যাকেজ") || hData.title === "রেফার কমিশন (প্যাকেজ ক্রয়)")) {
                  totalPackageRefIncome += Number(hData.amount || 0);
                }
              });
            } catch (histErr) {
              console.error("রেফার হিস্ট্রি লোড করতে সমস্যা:", histErr);
            }

            document.getElementById('totalReferralIncome').innerText = `৳ ${totalPackageRefIncome.toFixed(2)}`;

            // লেভেল ১ কুয়েরি (যাদের `referredBy` আপনার রেফারেল কোডের সমান)
            const qLevel1 = query(collection(db, "users"), where("referredBy", "==", myReferralCode));
            const querySnapshot1 = await getDocs(qLevel1);

            let level1Users = [];
            let level1Codes = [];
            let paidLevel1Count = 0;

            querySnapshot1.forEach((docSnap) => {
              const data = docSnap.data();
              level1Users.push(data);
              if (hasActivePackage(data)) {
                paidLevel1Count++;
              }
              if (data.referralCode) {
                level1Codes.push(data.referralCode);
              }
            });

            document.getElementById('level1Count').innerText = level1Users.length;
            // শুধুমাত্র যেসব লেভেল ১ মেম্বার প্যাকেজ কিনেছে ও অ্যাডমিন সেটিংস অনুযায়ী মাসিক ভাতা হিসাব হবে
            renderMonthlyAllowance(paidLevel1Count, configuredTiers, adminSalary);

            const level1ListEl = document.getElementById('level1List');
            if (level1Users.length === 0) {
              level1ListEl.innerHTML = '<div class="no-member">কোনো লেভেল ১ মেম্বার নেই।</div>';
            } else {
              let html1 = '';
              level1Users.forEach(member => {
                html1 += `
                  <div class="member-card">
                      <div class="member-info">
                          <strong>${member.name || 'নামবিহীন'}</strong>
                          <span>ফোন: ${member.phone || 'নেই'}</span>
                      </div>
                      <div>প্যাকেজ: <strong>${member.package || 'নিষ্ক্রিয়'}</strong></div>
                  </div>
                `;
              });
              level1ListEl.innerHTML = html1;
            }

            // লেভেল ২ কুয়েরি (যাদের `referredBy` লেভেল ১ মেম্বারদের রেফারেল কোডের কোনো একটির সমান)
            let level2Users = [];
            if (level1Codes.length > 0) {
              for (let code of level1Codes) {
                const qLevel2 = query(collection(db, "users"), where("referredBy", "==", code));
                const querySnapshot2 = await getDocs(qLevel2);
                querySnapshot2.forEach((docSnap) => {
                  level2Users.push(docSnap.data());
                });
              }
            }

            document.getElementById('level2Count').innerText = level2Users.length;

            const level2ListEl = document.getElementById('level2List');
            if (level2Users.length === 0) {
              level2ListEl.innerHTML = '<div class="no-member">কোনো লেভেল ২ মেম্বার নেই।</div>';
            } else {
              let html2 = '';
              level2Users.forEach(member => {
                html2 += `
                  <div class="member-card">
                      <div class="member-info">
                          <strong>${member.name || 'নামবিহীন'}</strong>
                          <span>ফোন: ${member.phone || 'নেই'}</span>
                      </div>
                      <div>প্যাকেজ: <strong>${member.package || 'নিষ্ক্রিয়'}</strong></div>
                  </div>
                `;
              });
              level2ListEl.innerHTML = html2;
            }

          } catch (error) {
            console.error("টিম ডাটা লোড করতে সমস্যা হয়েছে:", error);
          }
        } else {
          window.location.href = "login.html";
        }
      });
    </script>

    <div class="ads-wrapper">
      <!-- টিম পেজ পপ-আপ মোডাল -->
      <div id="teamNoticeModal" class="notice-modal-overlay" style="display: none;">
          <div class="notice-modal-content">
              <span class="notice-close-btn" onclick="closeTeamNotice()">&times;</span>
              <div class="notice-image-container">
                  <img src="https://i.ibb.co.com/C5SnVx0D/1795267140051.jpg" alt="Team Notice" style="width: 100%; border-radius: 8px;">
              </div>
          </div>
      </div>

      <style>
      .notice-modal-overlay {
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background-color: rgba(0, 0, 0, 0.7);
          display: flex; justify-content: center; align-items: center;
          z-index: 9999;
      }
      .notice-modal-content {
          background-color: #3b4252;
          padding: 20px; border-radius: 12px;
          width: 90%; max-width: 350px; position: relative;
      }
      .notice-close-btn {
          position: absolute; top: 10px; right: 15px;
          color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
          background: #4c566a; width: 30px; height: 30px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center; z-index: 10;
      }
      </style>

      <script>
      // টিম পেজের পপ-আপ বন্ধ করার ফাংশন
      function closeTeamNotice() {
          const modal = document.getElementById('teamNoticeModal');
          if (modal) {
              modal.style.display = 'none';
          }
      }

      // টিম পেজে ঢোকার সাথে সাথে পপ-আপ দেখানোর জন্য
      window.addEventListener('DOMContentLoaded', () => {
          const modal = document.getElementById('teamNoticeModal');
          if (modal) {
              modal.style.display = 'flex';
          }
      });
      </script>

      <!-- ব্যানার স্লট ১ -->
      <div class="ad-banner-container">
        <script async="async" data-cfasync="false" src="https://bauval.org/21/e67235acb5b7230c8c2fdb2cd4915292"></script>
        <div id="container-e67235acb5b7230c8c2fdb2cd4915292"></div>
        <span style="font-size: 11px; color: #a0aec0;"></span>
      </div>
    </div>

    <!-- Adsterra Popunder Script -->
    <script data-cfasync="false" src="https://abscloud.org/1/f949cf1c59ca89a989627ab501475853"></script>
</body>
