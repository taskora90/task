<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্যাকেজ কিনুন</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2 class="header"><i class="fa-solid fa-box-open"></i> প্যাকেজ নির্বাচন করুন</h2>

        <!-- প্যাকেজ ১ -->
        <div class="package-card">
            <div class="package-title">Task 1 (লেভেল ১)</div>
            <div class="package-price">মূল্য: ৳ ৩০০০</div>
            <button class="buy-btn" id="btn-task-1" onclick="checkBalance(3000, 'task.1', 1)">প্যাকেজ ১ কিনুন</button>
        </div>

        <!-- প্যাকেজ ২ -->
        <div class="package-card">
            <div class="package-title">Task 2 (লেভেল ২)</div>
            <div class="package-price">মূল্য: ৳ ৪৫০০</div>
            <button class="buy-btn" id="btn-task-2" onclick="checkBalance(4500, 'task.2', 2)">প্যাকেজ ২ কিনুন</button>
        </div>

        <!-- প্যাকেজ ৩ -->
        <div class="package-card">
            <div class="package-title">Task 3 (লেভেল ৩)</div>
            <div class="package-price">মূল্য: ৳ ৬০০০</div>
            <button class="buy-btn" id="btn-task-3" onclick="checkBalance(6000, 'task.3', 3)">প্যাকেজ ৩ কিনুন</button>
        </div>

        <!-- প্যাকেজ ৪ -->
        <div class="package-card">
            <div class="package-title">Task 4 (লেভেল ৪)</div>
            <div class="package-price">মূল্য: ৳ ৭৫০০</div>
            <button class="buy-btn" id="btn-task-4" onclick="checkBalance(7500, 'task.4', 4)">প্যাকেজ ৪ কিনুন</button>
        </div>

        <br>
        <a href="profile.html" style="text-decoration: none; color: #6c757d;"><i class="fa-solid fa-arrow-left"></i> প্রোফাইলে ফিরে যান</a>
    </div>
    <style>
        body { font-family: Arial, sans-serif; background-color: #dcdcdc; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 450px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 20px; color: #2b2d42; }
        .package-card { background: #eef2f5; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; border: 1px solid #ccc; }
        .package-title { font-size: 18px; font-weight: bold; color: #007bff; margin-bottom: 8px; }
        .package-price { font-size: 16px; font-weight: bold; color: #28a745; margin-bottom: 12px; }
        .buy-btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        .buy-btn:hover { background-color: #0056b3; }
    </style>
</head>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const packagePrices = {
        "task.1": 3000, "G.1": 3000, "1": 3000,
        "task.2": 4500, "G.2": 4500, "2": 4500,
        "task.3": 6000, "G.3": 6000, "3": 6000,
        "task.4": 7500, "G.4": 7500, "4": 7500
      };

      const packageLevels = {
        "task.1": 1, "G.1": 1, "1": 1,
        "task.2": 2, "G.2": 2, "2": 2,
        "task.3": 3, "G.3": 3, "3": 3,
        "task.4": 4, "G.4": 4, "4": 4
      };

      let loggedInUser = null;
      let currentUserData = null;

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          loggedInUser = user;
          const userDocRef = doc(db, "users", user.uid);
          const userDoc = await getDoc(userDocRef);
          
          if (userDoc.exists()) {
            currentUserData = userDoc.data();
            const currentPkg = currentUserData.package;
            const currentLevel = packageLevels[currentPkg] || 0;

            if (currentLevel > 0) {
              for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById(`btn-task-${i}`);
                if (i < currentLevel) {
                  btn.innerText = "ক্রয় করা যাবে না";
                  btn.style.backgroundColor = "#ccc";
                  btn.style.cursor = "not-allowed";
                  btn.onclick = () => alert("আপনি ছোট বা পূর্বের প্যাকেজে নামতে পারবেন না!");
                } else if (i === currentLevel) {
                  btn.innerText = "সক্রিয় প্যাকেজ";
                  btn.style.backgroundColor = "#28a745";
                  btn.style.cursor = "default";
                  btn.onclick = () => alert("এটি আপনার বর্তমানে সক্রিয় প্যাকেজ!");
                }
              }
            }
          }
        } else {
          window.location.href = "login.html";
        }
      });

      window.checkBalance = async function(price, packageName, targetLevel) {
        if (!loggedInUser || !currentUserData) {
          alert("লগইন না থাকলে প্যাকেজ কিনতে পারবেন না।");
          window.location.href = "login.html";
          return;
        }

        const previousPackage = currentUserData.package;
        const currentLevel = packageLevels[previousPackage] || 0;

        if (currentLevel > 0 && targetLevel < currentLevel) {
          alert("বড় প্যাকেজ থেকে ছোট প্যাকেজে নামা নিষেধ!");
          return;
        }

        const currentMyCash = currentUserData.myCash || 0;

        if (currentMyCash >= price) {
          const newMyCash = currentMyCash - price;
          let updateData = {
            myCash: newMyCash,
            package: packageName
          };

          let isFirstTimePackage = !previousPackage;
          let spinReward = targetLevel; // প্যাকেজ ১ = ১ স্পিন, ২ = ২ স্পিন, ৩ = ৩ স্পিন, ৪ = ৪ স্পিন

          if (isFirstTimePackage) {
            updateData.luckySpinCount = increment(spinReward);
          } else {
            let levelDiff = targetLevel - currentLevel;
            if (levelDiff > 0) {
              let upgradeSpinReward = levelDiff; 
              updateData.luckySpinCount = increment(upgradeSpinReward);
            }
          }

          if (previousPackage && packagePrices[previousPackage]) {
            const refundAmount = packagePrices[previousPackage]; 
            updateData.taskCash = increment(refundAmount);
            updateData.totalEarned = increment(refundAmount);
          }

          const userDocRef = doc(db, "users", loggedInUser.uid);
          await updateDoc(userDocRef, updateData);

          const referrerCode = currentUserData.referredBy;
          if (referrerCode && isFirstTimePackage) {
            const usersRef = collection(db, "users");
            const q = query(usersRef, where("referralCode", "==", referrerCode));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
              querySnapshot.forEach(async (referrerDoc) => {
                const referrerRef = doc(db, "users", referrerDoc.id);
                await updateDoc(referrerRef, {
                  luckySpinCount: increment(spinReward) 
                });
              });
            }
          }

          alert("অভিনন্দন! প্যাকেজটি সফলভাবে আপডেট হয়েছে এবং আগের প্যাকেজের সম্পূর্ণ টাকা টাস্ক ক্যাশে জমা হয়েছে।");
          window.location.href = "task.html";
        } else {
          alert("মাই ক্যাশে পর্যাপ্ত পরিমাণ ব্যালেন্স নেই, দয়া করে রিচার্জ করুন।");
        }
      };
    </script>
</body>
</html>
