<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোন অ্যাডমিন প্যানেল - TaskOra</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        /* লগইন বক্স স্টাইল */
        #loginBox {
            max-width: 350px;
            margin: 100px auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }
        #loginBox input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        /* ড্যাশবোর্ড স্টাইল */
        #adminDashboard {
            display: none;
        }
        .header {
            background: #2b2d42;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h2 { margin: 0; font-size: 20px; }
        
        /* সেটিংস কার্ড */
        .settings-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .settings-card h3 { margin-top: 0; color: #2b2d42; font-size: 16px; margin-bottom: 15px; }
        .setting-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            align-items: center;
        }
        .setting-row label { flex: 1; font-weight: 500; font-size: 14px; }
        .setting-row input { flex: 2; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .save-settings-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* রিকোয়েস্ট কার্ড */
        .request-card {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .request-info h4 { margin: 0 0 5px 0; color: #333; }
        .request-info p { margin: 3px 0; font-size: 14px; color: #666; }
        
        .btn-group button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
        }
        .btn-approve { background-color: #28a745; color: white; }
        .btn-approve:hover { background-color: #218838; }
        .btn-reject { background-color: #dc3545; color: white; }
        .btn-reject:hover { background-color: #c82333; }
        
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .no-data {
            text-align: center;
            color: #777;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ১. পাসওয়ার্ড লগইন বক্স -->
        <div id="loginBox">
            <h3>অ্যাডমিন লগইন</h3>
            <p style="font-size: 13px; color: #666;">লোন প্যানেলে প্রবেশ করতে পাসওয়ার্ড দিন</p>
            <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড দিন (যেমন: admin123)">
            <button onclick="checkAdminLogin()" style="width:100%; background:#007bff; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">লগইন করুন</button>
        </div>

        <!-- ২. অ্যাডমিন ড্যাশবোর্ড -->
        <div id="adminDashboard">
            <div class="header">
                <h2>📋 লোন রিকোয়েস্ট ও সেটিংস ম্যানেজমেন্ট</h2>
                <button class="logout-btn" onclick="location.reload()">লগআউট</button>
            </div>

            <!-- প্যাকেজ অনুযায়ী লোন অ্যামাউন্ট কন্ট্রোল করার সেকশন -->
            <div class="settings-card">
                <h3>⚙️ প্যাকেজ অনুযায়ী লোন অ্যামাউন্ট সেটআপ করুন</h3>
                <div class="setting-row">
                    <label>টাস্ক প্যাকেজ ১ (অথবা Standard):</label>
                    <input type="number" id="loanPkg1" value="1000">
                </div>
                <div class="setting-row">
                    <label>টাস্ক প্যাকেজ ২ (অথবা VIP):</label>
                    <input type="number" id="loanPkg2" value="3000">
                </div>
                <div class="setting-row">
                    <label>অন্যান্য / ডিফল্ট প্যাকেজ:</label>
                    <input type="number" id="loanPkgDefault" value="500">
                </div>
                <button class="save-settings-btn" onclick="saveLoanSettings()">সেটিংস সেভ করুন</button>
            </div>

            <!-- লিকোয়েস্ট লিস্ট সেকশন -->
            <h3 style="color: #2b2d42; margin-bottom: 10px;">পেন্ডিং লোন রিকোয়েস্টসমূহ</h3>
            <div id="requestsList">
                <p style="text-align:center;">ডাটা লোড হচ্ছে...</p>
            </div>
        </div>

    </div>

    <!-- Firebase JavaScript SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, increment, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
          authDomain: "taskora-b2b29.firebaseapp.com",
          projectId: "taskora-b2b29",
          storageBucket: "taskora-b2b29.firebasestorage.app",
          messagingSenderId: "376297360134",
          appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
          measurementId: "G-9803M7DPM5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // অ্যাডমিন পাসওয়ার্ড চেক ফাংশন
        window.checkAdminLogin = function() {
            const pass = document.getElementById('adminPassword').value;
            const correctPassword = "admin123"; // <--- আপনার ইচ্ছামতো পাসওয়ার্ড পরিবর্তন করতে পারেন

            if (pass === correctPassword) {
                document.getElementById('loginBox').style.display = "none";
                document.getElementById('adminDashboard').style.display = "block";
                loadLoanSettings();
                loadLoanRequests();
            } else {
                alert("ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
            }
        };

        // ফায়ারবেস থেকে লোন সেটিংস লোড করা
        async function loadLoanSettings() {
            try {
                const settingsRef = doc(db, "admin_settings", "loan_config");
                const docSnap = await getDoc(settingsRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('loanPkg1').value = data.pkg1 || 1000;
                    document.getElementById('loanPkg2').value = data.pkg2 || 3000;
                    document.getElementById('loanPkgDefault').value = data.pkgDefault || 500;
                }
            } catch (error) {
                console.error("Error loading settings: ", error);
            }
        }

        // অ্যাডমিন প্যানেল থেকে লোন সেটিংস সেভ করা
        window.saveLoanSettings = async function() {
            const pkg1 = Number(document.getElementById('loanPkg1').value);
            const pkg2 = Number(document.getElementById('loanPkg2').value);
            const pkgDefault = Number(document.getElementById('loanPkgDefault').value);

            try {
                const settingsRef = doc(db, "admin_settings", "loan_config");
                await setDoc(settingsRef, {
                    pkg1: pkg1,
                    pkg2: pkg2,
                    pkgDefault: pkgDefault
                }, { merge: true });

                alert("লিনের সেটিংস সফলভাবে আপডেট করা হয়েছে!");
            } catch (error) {
                console.error("Error saving settings: ", error);
                alert("সেটিংস সেভ করতে সমস্যা হয়েছে।");
            }
        };

        // পেন্ডিং লোন রিকোয়েস্টগুলো ফায়ারবেস থেকে লোড করা
        async function loadLoanRequests() {
            const listContainer = document.getElementById('requestsList');
            listContainer.innerHTML = "<p style='text-align:center;'>লোড হচ্ছে...</p>";

            try {
                const q = query(collection(db, "loan_requests"), where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listContainer.innerHTML = `<div class="no-data">এই মুহূর্তে কোনো নতুন লোন রিকোয়েস্ট নেই।</div>`;
                    return;
                }

                let html = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const reqId = docSnap.id;

                    html += `
                        <div class="request-card">
                            <div class="request-info">
                                <h4>নাম: ${data.userName || "N/A"}</h4>
                                <p>ফোন: ${data.userPhone || "N/A"}</p>
                                <p>প্যাকেজ: <strong>${data.userPackage || "N/A"}</strong></p>
                                <p>লোনের পরিমাণ: <strong>৳ ${data.amount}</strong></p>
                            </div>
                            <div class="btn-group">
                                <button class="btn-approve" onclick="handleLoan('${reqId}', '${data.userId}', ${data.amount}, 'approved')">অ্যাপ্রুভ</button>
                                <button class="btn-reject" onclick="handleLoan('${reqId}', '${data.userId}', ${data.amount}, 'rejected')">রিজেক্ট</button>
                            </div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;

            } catch (error) {
                console.error("Error loading requests: ", error);
                listContainer.innerHTML = `<div class="no-data" style="color:red;">ডাটা লোড করতে সমস্যা হয়েছে।</div>`;
            }
        }

        // লোন অ্যাপ্রুভ বা রিজেক্ট হ্যান্ডেল করার ফাংশন
        window.handleLoan = async function(requestId, userId, amount, action) {
            const confirmMsg = action === 'approved' 
                ? `আপনি কি নিশ্চিতভাবে এই লোনটি অ্যাপ্রুভ করতে চান? এটি ইউজারের My Cash-এ জমা হবে।` 
                : `আপনি কি এই লোন রিকোয়েস্টটি রিজেক্ট করতে চান?`;

            if (!confirm(confirmMsg)) return;

            try {
                const requestRef = doc(db, "loan_requests", requestId);

                if (action === 'approved') {
                    const userRef = doc(db, "users", userId);
                    await updateDoc(userRef, {
                        myCash: increment(amount),
                        loan_status: "active"
                    });

                    await updateDoc(requestRef, { status: "approved" });
                    alert("লোন সফলভাবে অ্যাপ্রুভ করা হয়েছে এবং ইউজারের My Cash-এ টাকা যোগ হয়েছে!");
                } else {
                    await updateDoc(requestRef, { status: "rejected" });
                    alert("লোন রিকোয়েস্টটি রিজেক্ট করা হয়েছে।");
                }

                loadLoanRequests();

            } catch (error) {
                console.error("Error updating loan: ", error);
                alert("অপারেশন সম্পন্ন করতে সমস্যা হয়েছে: " + error.message);
            }
        };
    </script>

</body>
</html>
