<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোন অ্যাডমিন প্যানেল - TaskOra</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; }
        #loginBox { max-width: 350px; margin: 100px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        #loginBox input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        #adminDashboard { display: none; }
        .header { background: #2b2d42; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { margin: 0; font-size: 20px; }
        .settings-card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .settings-card h3 { margin-top: 0; color: #2b2d42; font-size: 16px; margin-bottom: 15px; }
        .setting-row { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; }
        .setting-row label { flex: 1; font-weight: 500; font-size: 14px; }
        .setting-row input { flex: 2; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .save-settings-btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .request-card { background: #fff; padding: 15px 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .request-info h4 { margin: 0 0 5px 0; color: #333; }
        .request-info p { margin: 3px 0; font-size: 14px; color: #666; }
        .btn-group button { padding: 8px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-left: 5px; }
        .btn-approve { background-color: #28a745; color: white; }
        .btn-approve:hover { background-color: #218838; }
        .btn-reject { background-color: #dc3545; color: white; }
        .btn-reject:hover { background-color: #c82333; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .no-data { text-align: center; color: #777; background: #fff; padding: 20px; border-radius: 8px; }

        /* উইথড্র প্রোফাইল ম্যানেজমেন্ট বাটন ও সেকশন স্টাইল */
        .withdraw-section-toggle { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; text-align: left; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .withdraw-profile-section { background: #fff; padding: 20px; border-radius: 8px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: none; }
        .withdraw-profile-section h3 { color: #2b2d42; margin-top: 0; margin-bottom: 15px; }
        .profile-search-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; }
        .profile-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .profile-table th, .profile-table td { border: 1px solid #dee2e6; padding: 10px; text-align: left; font-size: 14px; }
        .profile-table th { background-color: #f8f9fa; color: #333; }
        .profile-table select, .profile-table input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-update { background-color: #17a2b8; color: white; padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete { background-color: #dc3545; color: white; padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ১. পাসওয়ার্ড প্রবেশ বক্স -->
        <div id="loginBox">
            <h3>অ্যাডমিন লগইন</h3>
            <p style="font-size: 13px; color: #666;">লোন প্যানেলে প্রবেশ করতে পাসওয়ার্ড দিন</p>
            <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড দিন">
            <button onclick="checkAdminLogin()" style="width:100%; background:#007bff; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">লগইন করুন</button>
        </div>

        <!-- ২. অ্যাডমিন ড্যাশবোর্ড -->
        <div id="adminDashboard">
            <div class="header">
                <h2>📋 লোন রিকোয়েস্ট ও প্যাকেজ লোন সেটিংস</h2>
                <button class="logout-btn" onclick="location.reload()">লগআউট</button>
            </div>

            <!-- ডাইনামিক প্যাকেজ লোন সেটিংস -->
            <div class="settings-card">
                <h3>⚙️ প্যাকেজ অনুযায়ী লোন অ্যামাউন্ট কনফিগার করুন</h3>
                <div id="dynamicPackageSettings">
                    <p>প্যাকেজসমূহ লোড হচ্ছে...</p>
                </div>
                <button class="save-settings-btn" onclick="saveLoanSettings()">সেটিংস সেভ করুন</button>
            </div>

            <h3 style="color: #2b2d42; margin-bottom: 10px;">পেন্ডিং লোন রিকোয়েস্টসমূহ</h3>
            <div id="requestsList">
                <p style="text-align:center;">ডাটা লোড হচ্ছে...</p>
            </div>

            <!-- ৩. উইথড্র প্রোফাইল ম্যানেজমেন্ট টগল বাটন -->
            <button class="withdraw-section-toggle" onclick="promptWithdrawPassword()">
                <span>👥 ইউজার উইথড্র প্রোফাইল ম্যানেজমেন্ট</span>
                <span>▼</span>
            </button>

            <!-- উইথড্র প্রোফাইল ম্যানেজমেন্ট সেকশন -->
            <div id="withdrawProfileSection" class="withdraw-profile-section">
                <h3>ইউজার উইথড্র প্রোফাইল লিস্ট</h3>
                <!-- সার্চ বাটন/ইনপুট -->
                <input type="text" id="withdrawSearchInput" class="profile-search-input" placeholder="ফোন নম্বর বা ইউজার আইডি দিয়ে সার্চ করুন..." onkeyup="filterWithdrawProfiles()">
                
                <div id="withdrawProfilesContainer">
                    <p style="text-align:center;">উইথড্র প্রোফাইলগুলো লোড হচ্ছে...</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, increment, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
          authDomain: "taskora-b2b29.firebaseapp.com",
          projectId: "taskora-b2b29",
          storageBucket: "taskora-b2b29.firebasestorage.app",
          messagingSenderId: "376297360134",
          appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
          measurementId: "G-9803M7DPM5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let packageList = [];
        let allWithdrawProfiles = [];

        // ১. অ্যাডমিন প্যানেলে ঢোকার পাসওয়ার্ড
        window.checkAdminLogin = function() {
            const pass = document.getElementById('adminPassword').value;
            const correctPassword = "TarekHasan@36"; // লোন প্যানেলের পাসওয়ার্ড

            if (pass === correctPassword) {
                document.getElementById('loginBox').style.display = "none";
                document.getElementById('adminDashboard').style.display = "block";
                loadPackagesAndSettings();
                loadLoanRequests();
            } else {
                alert("ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
            }
        };

        // ২. আলাদা সিক্রেট পাসওয়ার্ড দিয়ে উইথড্র প্রোফাইল সেকশন খোলার ফাংশন
        window.promptWithdrawPassword = function() {
            const section = document.getElementById('withdrawProfileSection');
            
            if (section.style.display === "block") {
                section.style.display = "none";
                return;
            }

            const pass = prompt("উইথড্র প্রোফাইল ম্যানেজমেন্টে প্রবেশ করতে সিক্রেট পাসওয়ার্ড দিন:");
            
            // উইথড্র সেকশনের জন্য আলাদা পাসওয়ার্ড
            const correctWithdrawPassword = "NIRJONA@36"; 

            if (pass === correctWithdrawPassword) {
                section.style.display = "block";
                loadWithdrawProfiles();
            } else if (pass !== null) {
                alert("ভুল সিক্রেট পাসওয়ার্ড!");
            }
        };

        // প্যাকেজসমূহ ও লোন সেটিংস একসাথে লোড করা
        async function loadPackagesAndSettings() {
            const settingsContainer = document.getElementById('dynamicPackageSettings');
            try {
                const q = query(collection(db, "packages"), orderBy("level", "asc"));
                const querySnapshot = await getDocs(q);

                packageList = [];
                querySnapshot.forEach((docSnap) => {
                    packageList.push(docSnap.data());
                });

                const settingsRef = doc(db, "admin_settings", "loan_config");
                const settingsSnap = await getDoc(settingsRef);
                const savedConfig = settingsSnap.exists() ? settingsSnap.data() : {};

                let html = `
                    <div class="setting-row">
                        <label><strong>কোনো প্যাকেজ নেই (Free User / No Package):</strong></label>
                        <input type="number" id="loan_pkg_none" value="${savedConfig['none'] || 0}" placeholder="লোন অ্যামাউন্ট">
                    </div>
                `;

                packageList.forEach((pkg) => {
                    const savedVal = savedConfig[pkg.packageId] !== undefined ? savedConfig[pkg.packageId] : (pkg.price * 0.5);
                    html += `
                        <div class="setting-row">
                            <label><strong>${pkg.name} (ID: ${pkg.packageId}):</strong></label>
                            <input type="number" id="loan_pkg_${pkg.packageId}" value="${savedVal}" placeholder="লোন অ্যামাউন্ট">
                        </div>
                    `;
                });

                settingsContainer.innerHTML = html;

            } catch (error) {
                console.error("Error loading packages/settings: ", error);
                settingsContainer.innerHTML = "<p style='color:red;'>প্যাকেজ তথ্য লোড করতে সমস্যা হয়েছে।</p>";
            }
        }

        // সেটিংস সেভ করার ফাংশন
        window.saveLoanSettings = async function() {
            try {
                const configToSave = {};
                configToSave['none'] = Number(document.getElementById('loan_pkg_none').value) || 0;

                packageList.forEach((pkg) => {
                    const inputEl = document.getElementById(`loan_pkg_${pkg.packageId}`);
                    if (inputEl) {
                        configToSave[pkg.packageId] = Number(inputEl.value) || 0;
                    }
                });

                const settingsRef = doc(db, "admin_settings", "loan_config");
                await setDoc(settingsRef, configToSave, { merge: true });

                alert("প্যাকেজভিত্তিক লোন সেটিংস সফলভাবে সেভ হয়েছে!");
            } catch (error) {
                console.error("Error saving settings: ", error);
                alert("সেটিংস সেভ করতে সমস্যা হয়েছে।");
            }
        };

        // রিকোয়েস্ট লিস্ট লোড করা
        async function loadLoanRequests() {
            const listContainer = document.getElementById('requestsList');
            listContainer.innerHTML = "<p style='text-align:center;'>লোড হচ্ছে...</p>";

            try {
                const q = query(collection(db, "loan_requests"), where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listContainer.innerHTML = `<div class="no-data">এই মুহূর্তে কোনো নতুন লোন রিকোয়েস্ট নেই।</div>`;
                    return;
                }

                let html = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const reqId = docSnap.id;

                    html += `
                        <div class="request-card">
                            <div class="request-info">
                                <h4>নাম: ${data.userName || "N/A"}</h4>
                                <p>ফোন: ${data.userPhone || "N/A"}</p>
                                <p>প্যাকেজ: <strong>${data.userPackage || "কোনো প্যাকেজ নেই"}</strong></p>
                                <p>লোনের পরিমাণ: <strong>৳ ${data.amount}</strong></p>
                            </div>
                            <div class="btn-group">
                                <button class="btn-approve" onclick="handleLoan('${reqId}', '${data.userId}', ${data.amount}, 'approved')">অ্যাপ্রুভ</button>
                                <button class="btn-reject" onclick="handleLoan('${reqId}', '${data.userId}', ${data.amount}, 'rejected')">রিজেক্ট</button>
                            </div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;
            } catch (error) {
                console.error("Error loading requests: ", error);
                listContainer.innerHTML = `<div class="no-data" style="color:red;">ডাটা লোড করতে সমস্যা হয়েছে।</div>`;
            }
        }

        // অ্যাপ্রুভ / রিজেক্ট হ্যান্ডেলিং
        window.handleLoan = async function(requestId, userId, amount, action) {
            const confirmMsg = action === 'approved' 
                ? `আপনি কি নিশ্চিতভাবে এই লোনটি অ্যাপ্রুভ করতে চান? এটি ইউজারের My Cash-এ জমা হবে।` 
                : `আপনি কি এই লোন রিকোয়েস্টটি রিজেক্ট করতে চান?`;

            if (!confirm(confirmMsg)) return;

            try {
                const requestRef = doc(db, "loan_requests", requestId);

                if (action === 'approved') {
                    const userRef = doc(db, "users", userId);
                    await updateDoc(userRef, {
                        myCash: increment(amount),
                        loan_status: "active"
                    });

                    await updateDoc(requestRef, { status: "approved" });
                    alert("লোন অ্যাপ্রুভ করা হয়েছে এবং ইউজারের My Cash (রিচার্জ ব্যালেন্স)-এ যোগ হয়েছে!");
                } else {
                    await updateDoc(requestRef, { status: "rejected" });
                    alert("লোন রিকোয়েস্টটি রিজেক্ট করা হয়েছে।");
                }

                loadLoanRequests();
            } catch (error) {
                console.error("Error updating loan: ", error);
                alert("অপারেশন সম্পন্ন করতে সমস্যা হয়েছে: " + error.message);
            }
        };

        // উইথড্র প্রোফাইলগুলো লোড করার ফাংশন
        async function loadWithdrawProfiles() {
            const container = document.getElementById('withdrawProfilesContainer');
            container.innerHTML = "<p style='text-align:center;'>লোড হচ্ছে...</p>";

            try {
                const querySnapshot = await getDocs(collection(db, "withdrawProfiles"));

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="no-data">কোনো উইথড্র প্রোফাইল পাওয়া যায়নি।</div>`;
                    allWithdrawProfiles = [];
                    return;
                }

                allWithdrawProfiles = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    allWithdrawProfiles.push({
                        id: docSnap.id,
                        ...data
                    });
                });

                renderWithdrawTable(allWithdrawProfiles);

            } catch (error) {
                console.error("Error loading withdraw profiles: ", error);
                container.innerHTML = `<div class="no-data" style="color:red;">উইথড্র প্রোফাইল লোড করতে সমস্যা হয়েছে।</div>`;
            }
        }

        // টেবিল রেন্ডার করার ফাংশন
        function renderWithdrawTable(profiles) {
            const container = document.getElementById('withdrawProfilesContainer');

            if (profiles.length === 0) {
                container.innerHTML = `<div class="no-data">কোনো ম্যাচিং উইথড্র প্রোফাইল পাওয়া যায়নি।</div>`;
                return;
            }

            let html = `
                <div style="overflow-x: auto;">
                    <table class="profile-table">
                        <thead>
                            <tr>
                                <th>ইউজার আইডি / ইমেইল</th>
                                <th>পেমেন্ট মাধ্যম</th>
                                <th>অ্যাকাউন্ট নম্বর</th>
                                <th>কার্যক্রম</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            profiles.forEach((data) => {
                const userId = data.id;
                const identifier = data.userEmailOrPhone || userId;

                html += `
                    <tr>
                        <td style="font-size: 12px; color: #555; word-break: break-all;">${identifier}</td>
                        <td>
                            <select id="method_${userId}">
                                <option value="bKash" ${data.method === 'bKash' ? 'selected' : ''}>বিকাশ</option>
                                <option value="Nagad" ${data.method === 'Nagad' ? 'selected' : ''}>নগদ</option>
                            </select>
                        </td>
                        <td>
                            <input type="text" id="account_${userId}" value="${data.account || ''}">
                        </td>
                        <td>
                            <button class="btn-update" onclick="updateWithdrawProfile('${userId}')">আপডেট</button>
                            <button class="btn-delete" onclick="deleteWithdrawProfile('${userId}')">ডিলিট</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        // সার্চ বা ফিল্টার ফাংশন
        window.filterWithdrawProfiles = function() {
            const searchText = document.getElementById('withdrawSearchInput').value.toLowerCase();
            const filtered = allWithdrawProfiles.filter(profile => {
                const account = (profile.account || '').toLowerCase();
                const userId = (profile.id || '').toLowerCase();
                const identifier = (profile.userEmailOrPhone || '').toLowerCase();
                return account.includes(searchText) || userId.includes(searchText) || identifier.includes(searchText);
            });
            renderWithdrawTable(filtered);
        };

        // উইথড্র প্রোফাইল আপডেট করার ফাংশন
        window.updateWithdrawProfile = async function(userId) {
            const method = document.getElementById(`method_${userId}`).value;
            const account = document.getElementById(`account_${userId}`).value.trim();

            if (!account) {
                alert("অ্যাকাউন্ট নম্বর খালি রাখা যাবে না!");
                return;
            }

            if (!confirm("আপনি কি এই উইথড্র প্রোফাইলটি আপডেট করতে চান?")) return;

            try {
                const profileRef = doc(db, "withdrawProfiles", userId);
                await updateDoc(profileRef, {
                    method: method,
                    account: account
                });

                alert("উইথড্র প্রোফাইল সফলভাবে আপডেট করা হয়েছে!");
                loadWithdrawProfiles();
            } catch (error) {
                console.error("Error updating profile: ", error);
                alert("আপডেট করতে সমস্যা হয়েছে: " + error.message);
            }
        };

        // উইথড্র প্রোফাইল ডিলিট করার ফাংশন
        window.deleteWithdrawProfile = async function(userId) {
            if (!confirm("সতর্কতা: আপনি কি সত্যিই এই উইথড্র প্রোফাইলটি ডিলিট করতে চান? এটি ডিলিট করলে ইউজার পুনরায় নতুন করে প্রোফাইল সেটআপ করতে পারবে।")) return;

            try {
                const profileRef = doc(db, "withdrawProfiles", userId);
                await deleteDoc(profileRef);

                alert("উইথড্র প্রোফাইল সফলভাবে ডিলিট করা হয়েছে!");
                loadWithdrawProfiles();
            } catch (error) {
                console.error("Error deleting profile: ", error);
                alert("ডিলিট করতে সমস্যা হয়েছে: " + error.message);
            }
        };
    </script>
</body>
