<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোন অ্যাডমিন প্যানেল - TaskOra</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; }
        #loginBox { max-width: 350px; margin: 100px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        #loginBox input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }

        #adminDashboard { display: none; }
        #loanProfilePage { display: none; } /* আলাদা লোন প্রোফাইল পেজ */

        .header { background: #2b2d42; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { margin: 0; font-size: 20px; }
        .settings-card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .settings-card h3 { margin-top: 0; color: #2b2d42; font-size: 16px; margin-bottom: 15px; }
        .setting-row { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; }
        .setting-row label { flex: 1; font-weight: 500; font-size: 14px; }
        .setting-row input { flex: 2; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .save-settings-btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* লোন কন্ট্রোল প্রোফাইল বাটন স্টাইল */
        .admin-profile-btn-wrapper { margin-bottom: 15px; }
        .btn-admin-profile { background: #0284c7; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); width: 100%; text-align: center; }
        .btn-admin-profile:hover { background: #0369a1; }

        .request-card { background: #fff; padding: 15px 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .request-info h4 { margin: 0 0 5px 0; color: #333; }
        .request-info p { margin: 3px 0; font-size: 14px; color: #666; }
        .btn-group button { padding: 8px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-left: 5px; }
        .btn-approve { background-color: #28a745; color: white; }
        .btn-reject { background-color: #dc3545; color: white; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .no-data { text-align: center; color: #777; background: #fff; padding: 20px; border-radius: 8px; }

        /* সার্চ ও আলাদা পেজ স্টাইল */
        .search-box { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        .back-btn { background: #475569; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .back-btn:hover { background: #334155; }

        /* মোডাল ও কন্ট্রোল কার্ড স্টাইল */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 20px; border-radius: 10px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-content input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; text-align: center; }
        .modal-btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn-close { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        .admin-loan-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .admin-loan-card p { margin: 4px 0; font-size: 14px; }
        .admin-action-btn-group { margin-top: 10px; display: flex; gap: 8px; }
        .btn-edit-loan { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .btn-delete-loan { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ১. পাসওয়ার্ড প্রবেশ বক্স -->
        <div id="loginBox">
            <h3>অ্যাডমিন লগইন</h3>
            <p style="font-size: 13px; color: #666;">প্যানেলে প্রবেশ করতে পাসওয়ার্ড দিন</p>
            <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড দিন">
            <button onclick="checkAdminLogin()" style="width:100%; background:#007bff; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">লগইন করুন</button>
        </div>

        <!-- ২. মূল লোন অ্যাডমিন ড্যাশবোর্ড -->
        <div id="adminDashboard">
            <div class="header">
                <h2>📋 লোন রিকোয়েস্ট ও প্যাকেজ লোন সেটিংস</h2>
                <button class="logout-btn" onclick="location.reload()">লগআউট</button>
            </div>

            <!-- ডাইনামিক প্যাকেজ লোন সেটিংস -->
            <div class="settings-card">
                <h3>⚙️ প্যাকেজ অনুযায়ী লোন অ্যামাউন্ট কনফিগার করুন</h3>
                <div id="dynamicPackageSettings">
                    <p>প্যাকেজসমূহ লোড হচ্ছে...</p>
                </div>
                <button class="save-settings-btn" onclick="saveLoanSettings()">সেটিংস সেভ করুন</button>
            </div>

            <!-- লোন রিকোয়েস্টের উপরে নতুন লোন কন্ট্রোল প্রোফাইল পেজে যাওয়ার বাটন -->
            <div class="admin-profile-btn-wrapper">
                <button class="btn-admin-profile" onclick="openAdminLoanProfilePage()">👤 চলমান লোন প্রোফাইল ও কন্ট্রোল পেজ</button>
            </div>

            <h3 style="color: #2b2d42; margin-bottom: 10px;">পেন্ডিং লোন রিকোয়েস্টসমূহ</h3>
            <div id="requestsList">
                <p style="text-align:center;">ডাটা লোড হচ্ছে...</p>
            </div>
        </div>

        <!-- ৩. আলাদা লোন কন্ট্রোল প্রোফাইল পেজ (শুধুমাত্র চলমান ও পেন্ডিং লোন) -->
        <div id="loanProfilePage">
            <button class="back-btn" onclick="backToDashboard()">← ড্যাশবোর্ডে ফিরে যান</button>
            <div class="header" style="margin-top: 5px;">
                <h2>👤 চলমান ও পেন্ডিং লোন কন্ট্রোল পেজ</h2>
            </div>
            
            <!-- সার্চ বক্স -->
            <input type="text" id="loanSearchInput" class="search-box" placeholder="🔍 নাম বা ফোন নম্বর দিয়ে সার্চ করুন..." onkeyup="filterLoanProfiles()">

            <div id="adminLoanListContainer">
                <p style="text-align:center;">ডেটা লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <!-- লোন এডিট মোডাল (Admin Edit) -->
    <div id="adminEditModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-size:16px;">ইউজারের লোন তথ্য এডিট করুন</h3>
            <input type="hidden" id="editLoanId">
            <label style="font-size:13px; font-weight:bold; display:block; text-align:left;">মূল লোন (Amount):</label>
            <input type="number" id="editAmountInput" placeholder="মূল লোন">
            <label style="font-size:13px; font-weight:bold; display:block; text-align:left;">বকেয়া পরিমাণ (Due Amount):</label>
            <input type="number" id="editDueInput" placeholder="বকেয়া পরিমাণ">
            <div class="modal-btn-group">
                <button class="save-settings-btn" style="margin-top:0;" onclick="saveEditedLoan()">সংরক্ষণ করুন</button>
                <button class="btn-close" onclick="closeAdminEditModal()">বাতিল</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, increment, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
          authDomain: "taskora-b2b29.firebaseapp.com",
          projectId: "taskora-b2b29",
          storageBucket: "taskora-b2b29.firebasestorage.app",
          messagingSenderId: "376297360134",
          appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
          measurementId: "G-9803M7DPM5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let packageList = [];
        let allLoansCache = []; // সার্চ ও ফিল্টারের জন্য ক্যাশ ডেটা

        window.checkAdminLogin = function() {
            const pass = document.getElementById('adminPassword').value;
            const correctPassword = "TarekHasan@36";

            if (pass === correctPassword) {
                document.getElementById('loginBox').style.display = "none";
                document.getElementById('adminDashboard').style.display = "block";
                loadPackagesAndSettings();
                loadLoanRequests();
            } else {
                alert("ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
            }
        };

        async function loadPackagesAndSettings() {
            const settingsContainer = document.getElementById('dynamicPackageSettings');
            try {
                const q = query(collection(db, "packages"), orderBy("level", "asc"));
                const querySnapshot = await getDocs(q);

                packageList = [];
                querySnapshot.forEach((docSnap) => {
                    packageList.push(docSnap.data());
                });

                const settingsRef = doc(db, "admin_settings", "loan_config");
                const settingsSnap = await getDoc(settingsRef);
                const savedConfig = settingsSnap.exists() ? settingsSnap.data() : {};

                let html = `
                    <div class="setting-row">
                        <label><strong>কোনো প্যাকেজ নেই (Free User / No Package):</strong></label>
                        <input type="number" id="loan_pkg_none" value="${savedConfig['none'] || 0}" placeholder="লোন অ্যামাউন্ট">
                    </div>
                `;

                packageList.forEach((pkg) => {
                    const savedVal = savedConfig[pkg.packageId] !== undefined ? savedConfig[pkg.packageId] : (pkg.price * 0.5);
                    html += `
                        <div class="setting-row">
                            <label><strong>${pkg.name} (ID: ${pkg.packageId}):</strong></label>
                            <input type="number" id="loan_pkg_${pkg.packageId}" value="${savedVal}" placeholder="লোন অ্যামাউন্ট">
                        </div>
                    `;
                });

                settingsContainer.innerHTML = html;

            } catch (error) {
                console.error("Error loading packages/settings: ", error);
                settingsContainer.innerHTML = "<p style='color:red;'>প্যাকেজ তথ্য লোড করতে সমস্যা হয়েছে।</p>";
            }
        }

        window.saveLoanSettings = async function() {
            try {
                const configToSave = {};
                configToSave['none'] = Number(document.getElementById('loan_pkg_none').value) || 0;

                packageList.forEach((pkg) => {
                    const inputEl = document.getElementById(`loan_pkg_${pkg.packageId}`);
                    if (inputEl) {
                        configToSave[pkg.packageId] = Number(inputEl.value) || 0;
                    }
                });

                const settingsRef = doc(db, "admin_settings", "loan_config");
                await setDoc(settingsRef, configToSave, { merge: true });

                alert("প্যাকেজভিত্তিক লোন সেটিংস সফলভাবে সেভ হয়েছে!");
            } catch (error) {
                console.error("Error saving settings: ", error);
                alert("সেটিংস সেভ করতে সমস্যা হয়েছে।");
            }
        };

        async function loadLoanRequests() {
            const listContainer = document.getElementById('requestsList');
            listContainer.innerHTML = "<p style='text-align:center;'>লোড হচ্ছে...</p>";

            try {
                const q = query(collection(db, "loan_requests"), where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listContainer.innerHTML = `<div class="no-data">এই মুহূর্তে কোনো নতুন লোন রিকোয়েস্ট নেই।</div>`;
                    return;
                }

                let html = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const reqId = docSnap.id;

                    html += `
                        <div class="request-card">
                            <div class="request-info">
                                <h4>নাম: ${data.userName || "N/A"}</h4>
                                <p>ফোন: ${data.userPhone || "N/A"}</p>
                                <p>প্যাকেজ: <strong>${data.userPackage || "কোনো প্যাকেজ নেই"}</strong></p>
                                <p>লোনের পরিমাণ: <strong>৳ ${data.amount}</strong></p>
                            </div>
                            <div class="btn-group">
                                <button class="btn-approve" onclick="handleLoan('${reqId}', '${data.userId}', ${data.amount}, 'approved')">অ্যাপ্রুভ</button>
                                <button class="btn-reject" onclick="handleLoan('${reqId}', '${data.userId}', ${data.amount}, 'rejected')">রিজেক্ট</button>
                            </div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;
            } catch (error) {
                console.error("Error loading requests: ", error);
                listContainer.innerHTML = `<div class="no-data" style="color:red;">ডাটা লোড করতে সমস্যা হয়েছে।</div>`;
            }
        }

        window.handleLoan = async function(requestId, userId, amount, action) {
            const confirmMsg = action === 'approved' 
                ? `আপনি কি নিশ্চিতভাবে এই লোনটি অ্যাপ্রুভ করতে চান? এটি ইউজারের My Cash-এ জমা হবে।` 
                : `আপনি কি এই লোন রিকোয়েস্টটি রিজেক্ট করতে চান?`;

            if (!confirm(confirmMsg)) return;

            try {
                const requestRef = doc(db, "loan_requests", requestId);

                if (action === 'approved') {
                    const userRef = doc(db, "users", userId);
                    await updateDoc(userRef, {
                        myCash: increment(amount),
                        loan_status: "active"
                    });

                    await updateDoc(requestRef, { 
                        status: "approved",
                        dueAmount: amount 
                    });
                    alert("লোন অ্যাপ্রুভ করা হয়েছে এবং ইউজারের My Cash-এ যোগ হয়েছে!");
                } else {
                    await updateDoc(requestRef, { status: "rejected" });
                    alert("লোন রিকোয়েস্টটি রিজেক্ট করা হয়েছে।");
                }

                loadLoanRequests();
            } catch (error) {
                console.error("Error updating loan: ", error);
                alert("অপারেশন সম্পন্ন করতে সমস্যা হয়েছে: " + error.message);
            }
        };

        // ==========================================
        // আলাদা লোন কন্ট্রোল পেজ ও ফিল্টারিং ফাংশনসমূহ
        // ==========================================
        window.openAdminLoanProfilePage = async function() {
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loanProfilePage').style.display = 'block';
            document.getElementById('adminLoanListContainer').innerHTML = "<p style='text-align:center;'>ডেটা লোড হচ্ছে...</p>";
            document.getElementById('loanSearchInput').value = "";

            try {
                const querySnapshot = await getDocs(collection(db, "loan_requests"));
                allLoansCache = [];

                querySnapshot.forEach(docSnap => {
                    allLoansCache.push({ id: docSnap.id, data: docSnap.data() });
                });

                renderLoanProfiles(allLoansCache);
            } catch (err) {
                console.error("Error loading admin loan profiles:", err);
                document.getElementById('adminLoanListContainer').innerHTML = "<p style='color:red; text-align:center;'>লোড করতে সমস্যা হয়েছে।</p>";
            }
        };

        window.backToDashboard = function() {
            document.getElementById('loanProfilePage').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadLoanRequests(); // ড্যাশবোর্ডে ফিরলে রিকোয়েস্ট রিফ্রেশ হবে
        };

        // রেন্ডার ফাংশন (শুধুমাত্র pending, approved বা active লোন দেখাবে, paid বাদ দিবে)
        function renderLoanProfiles(loansArray) {
            let activeLoans = loansArray.filter(item => {
                const status = item.data.status;
                const due = item.data.dueAmount !== undefined ? Number(item.data.dueAmount) : Number(item.data.amount);
                // যেগুলো পেইড নয় এবং স্ট্যাটাস paid নয়, শুধু সেগুলো দেখাবে
                return status !== 'paid' && due > 0 && (status === 'approved' || status === 'active' || status === 'pending');
            });

            // লেটেস্টগুলো উপরে দেখানোর জন্য সর্টিং
            activeLoans.sort((a, b) => {
                let timeA = a.data.requestTime ? a.data.requestTime.toMillis() : 0;
                let timeB = b.data.requestTime ? b.data.requestTime.toMillis() : 0;
                return timeB - timeA;
            });

            let html = "";
            if (activeLoans.length === 0) {
                html = "<div class='no-data'>এই মুহূর্তে কোনো চলমান বা পেন্ডিং লোন নেই।</div>";
            } else {
                activeLoans.forEach(item => {
                    const loan = item.data;
                    const loanId = item.id;
                    const originalAmount = Number(loan.amount || 0);
                    const dueAmount = loan.dueAmount !== undefined ? Number(loan.dueAmount) : originalAmount;
                    const paidAmount = originalAmount - dueAmount;

                    let historyText = "";
                    if (loan.history && loan.history.length > 0) {
                        loan.history.forEach(h => {
                            historyText += `• ${h.date}: ৳${h.amount} (${h.type})<br>`;
                        });
                    } else {
                        historyText = "কোনো পেমেন্ট কাটার হিস্ট্রি নেই";
                    }

                    let statusBadge = loan.status === 'pending' ? '<span style="color:orange; font-weight:bold;">পেন্ডিং (Pending)</span>' : '<span style="color:green; font-weight:bold;">চলমান (Active)</span>';

                    html += `
                        <div class="admin-loan-card">
                            <p><strong>ইউজার নাম:</strong> ${loan.userName || "N/A"} (${loan.userPhone || "N/A"})</p>
                            <p><strong>প্যাকেজ:</strong> ${loan.userPackage || "N/A"}</p>
                            <p><strong>মূল লোন:</strong> ৳${originalAmount} | <strong>বকেয়া (Due):</strong> <span style="color:red; font-weight:bold;">৳${dueAmount}</span></p>
                            <p><strong>মোট পরিশোধিত:</strong> ৳${paidAmount >= 0 ? paidAmount : 0} | <strong>স্ট্যাটাস:</strong> ${statusBadge}</p>
                            <div style="background:#f1f5f9; padding:8px; border-radius:4px; margin-top:6px; font-size:12px;">
                                <strong>হিস্ট্রি ও কাটার বিবরণ:<br></strong> ${historyText}
                            </div>
                            <div class="admin-action-btn-group">
                                <button class="btn-edit-loan" onclick="openAdminEditModal('${loanId}', ${originalAmount}, ${dueAmount})">এডিট</button>
                                <button class="btn-delete-loan" onclick="deleteLoanRecord('${loanId}')">ডিলিট</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('adminLoanListContainer').innerHTML = html;
        }

        // সার্চ ফিল্টার ফাংশন
        window.filterLoanProfiles = function() {
            const queryText = document.getElementById('loanSearchInput').value.toLowerCase().trim();
            
            const filtered = allLoansCache.filter(item => {
                const name = (item.data.userName || "").toLowerCase();
                const phone = (item.data.userPhone || "").toLowerCase();
                return name.includes(queryText) || phone.includes(queryText);
            });

            renderLoanProfiles(filtered);
        };

        window.openAdminEditModal = function(loanId, amount, due) {
            document.getElementById('editLoanId').value = loanId;
            document.getElementById('editAmountInput').value = amount;
            document.getElementById('editDueInput').value = due;
            document.getElementById('adminEditModal').style.display = 'flex';
        };

        window.closeAdminEditModal = function() {
            document.getElementById('adminEditModal').style.display = 'none';
        };

        window.saveEditedLoan = async function() {
            const loanId = document.getElementById('editLoanId').value;
            const newAmount = parseFloat(document.getElementById('editAmountInput').value);
            const newDue = parseFloat(document.getElementById('editDueInput').value);

            if (isNaN(newAmount) || isNaN(newDue)) {
                alert("দয়া করে সঠিক সংখ্যা লিখুন!");
                return;
            }

            try {
                const loanRef = doc(db, "loan_requests", loanId);
                let updatePayload = {
                    amount: newAmount,
                    dueAmount: newDue
                };
                if (newDue <= 0) {
                    updatePayload.status = "paid";
                } else {
                    updatePayload.status = "approved";
                }

                await updateDoc(loanRef, updatePayload);
                alert("লোন তথ্য সফলভাবে আপডেট করা হয়েছে!");
                closeAdminEditModal();
                openAdminLoanProfilePage(); // পেজ রিফ্রেশ করবে
            } catch (err) {
                console.error("Error updating loan:", err);
                alert("আপডেট করতে সমস্যা হয়েছে।");
            }
        };

        window.deleteLoanRecord = async function(loanId) {
            if (!confirm("আপনি কি নিশ্চিতভাবে এই লোন রেকর্ডটি ডিলিট করতে চান?")) return;

            try {
                await deleteDoc(doc(db, "loan_requests", loanId));
                alert("লোন রেকর্ড সফলভাবে ডিলিট করা হয়েছে!");
                openAdminLoanProfilePage(); // পেজ রিফ্রেশ করবে
            } catch (err) {
                console.error("Error deleting loan:", err);
                alert("ডিলিট করতে সমস্যা হয়েছে।");
            }
        };
    </script>
</body>
</html>
