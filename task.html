<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>দৈনিক টাস্ক - Task</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .task-container {
      max-width: 450px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .task-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .task-header h2 {
      margin: 0;
      color: #2b2d42;
    }

    .task-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background: #fafafa;
    }

    .task-title {
      font-size: 16px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .task-reward {
      font-size: 14px;
      color: #28a745;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-start {
      background-color: #007bff;
      color: white;
    }

    .btn-start:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    .btn-claim {
      background-color: #28a745;
      color: white;
    }

    .timer-text {
      font-weight: bold;
      color: #dc3545;
      text-align: center;
      margin-top: 8px;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #6c757d;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="task-container">
    <div class="task-header">
      <h2><i class="fa-solid fa-list-check"></i> ভিডিও টাস্ক</h2>
      <p style="font-size: 13px; color: #6c757d;">ভিডিও সম্পূর্ণ দেখে পয়েন্ট বা বোনাস আয় করুন</p>
    </div>

    <!-- টাস্ক ১ -->
    <div class="task-card">
      <div class="task-title">১. ৩ মিনিট ভিডিওটি দেখুন</div>
      <div class="task-reward"><i class="fa-solid fa-coins"></i> রিওয়ার্ড: ১০ টাকা</div>
      
      <!-- ইউটিউব ভিডিও এমবেড -->
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>
      </div>

      <!-- স্টার্ট ও ক্লেইম বাটন -->
      <button class="btn btn-start" id="startBtn1" onclick="startTimer(1, 30)">টাস্ক শুরু করুন</button>
      <div class="timer-text" id="timer1" style="display: none;"></div>
    </div>

    <a href="index.html" class="back-btn">← হোম পেজে ফিরে যান</a>
  </div>

  <script>
    function startTimer(taskId, duration) {
      const startBtn = document.getElementById('startBtn' + taskId);
      const timerDisplay = document.getElementById('timer' + taskId);

      startBtn.disabled = true;
      timerDisplay.style.display = 'block';

      let timeLeft = duration;

      const countdown = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timerDisplay.style.display = 'none';

          // বাটনটি পরিবর্তন করে Claim বাটন বানিয়ে দেওয়া
          startBtn.innerText = 'পুরস্কার সংগ্রহ করুন (Claim)';
          startBtn.className = 'btn btn-claim';
          startBtn.disabled = false;
          startBtn.onclick = function() {
            alert('অভিনন্দন! ১০ টাকা আপনার একাউন্টে যোগ করা হয়েছে।');
            startBtn.innerText = 'সম্পন্ন হয়েছে (Completed)';
            startBtn.disabled = true;
            startBtn.style.backgroundColor = '#6c757d';
          };
        } else {
          timerDisplay.innerText = 'অনুগ্রহ করে অপেক্ষা করুন: ' + timeLeft + ' সেকেন্ড';
          timeLeft--;
        }
      }, 1000);
    }
  </script>

</body>
  </html>
