<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
        .admin-container { max-width: 100%; width: 100%; margin: 0 auto; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box; }
        
        /* পাসওয়ার্ড লগইন বক্স স্টাইল */
        .login-box { max-width: 350px; margin: 60px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .login-box h3 { margin-top: 0; color: #333; margin-bottom: 20px; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; outline: none; }
        .login-btn { width: 100%; background: #007bff; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .login-btn:hover { background: #0056b3; }
        .error-msg { color: #dc3545; font-size: 14px; margin-top: 10px; display: none; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-logout { background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }

        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab-btn { flex: 1; padding: 12px 5px; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 15px; text-align: center; }
        .tab-btn.active { border-bottom: 3px solid #007bff; color: #007bff; }
        .request-card { background: #fafafa; border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; word-break: break-all; }
        .btn-approve { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .btn-reject { background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- লগইন ফর্ম সেকশন -->
    <div id="loginSection" class="login-box">
        <h3><i class="fa-solid fa-lock"></i> অ্যাডমিন লগইন</h3>
        <input type="password" id="adminPassInput" class="login-input" placeholder="পাসওয়ার্ড লিখুন...">
        <button class="login-btn" onclick="verifyAdminPassword()">প্রবেশ করুন</button>
        <div id="loginError" class="error-msg">ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</div>
    </div>

    <!-- মূল অ্যাডমিন ড্যাশবোর্ড (ডিফল্টভাবে হাইড থাকবে) -->
    <div id="adminDashboard" class="admin-container" style="display: none;">
        <div class="header-bar">
            <h2 style="margin: 0;">অ্যাডমিন ড্যাশবোর্ড</h2>
            <button class="btn-logout" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="rechargeTabBtn" onclick="switchTab('recharge')">রিচার্জ রিকোয়েস্ট</button>
            <button class="tab-btn" id="withdrawTabBtn" onclick="switchTab('withdraw')">উত্তোলন রিকোয়েস্ট</button>
        </div>

        <!-- রিচার্জ সেকশন -->
        <div id="rechargeSection">
            <h3>রিচার্জ রিকোয়েস্ট তালিকা</h3>
            <div id="rechargeList">লোড হচ্ছে...</div>
        </div>

        <!-- উত্তোলন সেকশন -->
        <div id="withdrawSection" style="display: none;">
            <h3>উত্তোলন রিকোয়েস্ট তালিকা</h3>
            <div id="withdrawList">লোড হচ্ছে...</div>
        </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // অ্যাডমিন পাসওয়ার্ড (প্রয়োজনে পরিবর্তন করুন)
      const ADMIN_PASSWORD = "TareHasan@36";

      // পাসওয়ার্ড ভেরিফিকেশন ফানশন
      window.verifyAdminPassword = function() {
        const inputPass = document.getElementById('adminPassInput').value;
        const errorEl = document.getElementById('loginError');

        if (inputPass === ADMIN_PASSWORD) {
          sessionStorage.setItem('isAdminLoggedIn', 'true');
          errorEl.style.display = 'none';
          showDashboard();
        } else {
          errorEl.style.display = 'block';
        }
      }

      // কীবোর্ডের Enter চাপলে লগইন হওয়া
      document.getElementById('adminPassInput').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') verifyAdminPassword();
      });

      // লগআউট ফানশন
      window.adminLogout = function() {
        sessionStorage.removeItem('isAdminLoggedIn');
        document.getElementById('adminDashboard').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('adminPassInput').value = '';
      }

      function showDashboard() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        loadRechargeRequests();
      }

      // পেজ লোড চেক
      document.addEventListener("DOMContentLoaded", () => {
        if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
          showDashboard();
        }
      });

      window.switchTab = function(type) {
        if(type === 'recharge') {
          document.getElementById('rechargeSection').style.display = 'block';
          document.getElementById('withdrawSection').style.display = 'none';
          document.getElementById('rechargeTabBtn').classList.add('active');
          document.getElementById('withdrawTabBtn').classList.remove('active');
          loadRechargeRequests();
        } else {
          document.getElementById('rechargeSection').style.display = 'none';
          document.getElementById('withdrawSection').style.display = 'block';
          document.getElementById('withdrawTabBtn').classList.add('active');
          document.getElementById('rechargeTabBtn').classList.remove('active');
          loadWithdrawRequests();
        }
      }

      // রিচার্জ রিকোয়েস্ট লোড করা
      async function loadRechargeRequests() {
        const listEl = document.getElementById('rechargeList');
        if (!listEl) return;
        listEl.innerHTML = "লোড হচ্ছে...";

        try {
          const querySnap = await getDocs(collection(db, "recharge_requests"));
          if (querySnap.empty) {
            listEl.innerHTML = "কোনো রিচার্জ রিকোয়েস্ট নেই।";
            return;
          }

          listEl.innerHTML = "";
          let count = 0;

          querySnap.forEach((d) => {
            const data = d.data();
            if (!data.status || data.status === 'pending') {
              count++;
              listEl.innerHTML += `
                <div class="request-card">
                  <p>ইউজার নাম: <strong>${data.userName || 'N/A'}</strong></p>
                  <p>ফোন/ইমেইল: <strong>${data.userPhone || data.userEmail || 'N/A'}</strong></p>
                  <p>পরিমাণ: <strong>৳ ${data.amount}</strong></p>
                  <p>মেথড: <strong>${data.method}</strong></p>
                  <p>TrxID: <strong style="color: #007bff;">${data.trxId}</strong></p>
                  <p>স্ট্যাটাস: <em>${data.status || 'pending'}</em></p>
                  <button class="btn-approve" onclick="handleRecharge('${d.id}', '${data.userId}', ${data.amount})">এপ্রুভ</button>
                  <button class="btn-reject" onclick="handleRejection('${d.id}')">রিজেক্ট</button>
                </div>
              `;
            }
          });

          if(count === 0) {
            listEl.innerHTML = "কোনো পেন্ডিং রিচার্জ রিকোয়েস্ট নেই।";
          }
        } catch (error) {
          console.error("রিচার্জ লোড ত্রুটি:", error);
          listEl.innerHTML = "ডেটা লোড করতে সমস্যা হয়েছে।";
        }
      }

      // রিচার্জ এপ্রুভ (myCash এ যোগ হবে)
      window.handleRecharge = async function(rechargeId, userId, amount) {
        try {
          const userRef = doc(db, "users", userId);
          const rechargeRef = doc(db, "recharge_requests", rechargeId);

          await updateDoc(userRef, {
            myCash: increment(amount)
          });

          await updateDoc(rechargeRef, { status: 'approved' });
          alert("রিচার্জ সফলভাবে অনুমোদিত হয়েছে এবং মাই ক্যাশে টাকা যোগ হয়েছে!");
          loadRechargeRequests();
        } catch (error) {
          console.error("Error:", error);
          alert("সমস্যা হয়েছে!");
        }
      }

      // রিচার্জ রিজেক্ট
      window.handleRejection = async function(rechargeId) {
        try {
          const rechargeRef = doc(db, "recharge_requests", rechargeId);
          await updateDoc(rechargeRef, { status: 'rejected' });
          alert("রিচার্জ রিকোয়েস্ট বাতিল করা হয়েছে।");
          loadRechargeRequests();
        } catch (error) {
          console.error("Error:", error);
          alert("সমস্যা হয়েছে!");
        }
      }

      // উত্তোলন রিকোয়েস্ট লোড করা
      async function loadWithdrawRequests() {
        const listEl = document.getElementById('withdrawList');
        if (!listEl) return;
        listEl.innerHTML = "লোড হচ্ছে...";

        try {
          const querySnap = await getDocs(collection(db, "withdrawals"));
          if (querySnap.empty) {
            listEl.innerHTML = "কোনো উত্তোলন রিকোয়েস্ট নেই। সাবমিট করা ডেটা নেই।";
            return;
          }

          listEl.innerHTML = "";
          let count = 0;
          querySnap.forEach((d) => {
            const data = d.data();
            if (!data.status || data.status === 'waiting' || data.status === 'processing') {
              count++;
              listEl.innerHTML += `
                <div class="request-card">
                  <p>ইউজার: <strong>${data.userEmail || data.userName || 'N/A'}</strong></p>
                  <p>পরিমাণ: <strong>৳ ${data.amount}</strong></p>
                  <p>মেথড: ${data.method || ''} (${data.account || ''})</p>
                  <p>স্ট্যাটাস: <em>${data.status || 'waiting'}</em></p>
                  <button class="btn-approve" onclick="handleWithdraw('${d.id}', '${data.userId}', ${data.amount}, 'approve')">এপ্রুভ</button>
                  <button class="btn-reject" onclick="handleWithdraw('${d.id}', '${data.userId}', ${data.amount}, 'reject')">রিজেক্ট</button>
                </div>
              `;
            }
          });

          if(count === 0) {
            listEl.innerHTML = "কোনো পেন্ডিং উত্তোলন রিকোয়েস্ট নেই।";
          }
        } catch (error) {
          console.error("Error:", error);
          listEl.innerHTML = "ডেটা লোড করতে সমস্যা হয়েছে।";
        }
      }

      // উত্তোলন এপ্রুভ বা রিজেক্ট হ্যান্ডলার
      window.handleWithdraw = async function(withdrawId, userId, amount, action) {
        try {
          const withdrawRef = doc(db, "withdrawals", withdrawId);

          if (action === 'approve') {
            await updateDoc(withdrawRef, { status: 'approved' });
            alert("উত্তোলন সফলভাবে অনুমোদিত হয়েছে!");
          } else {
            await updateDoc(withdrawRef, { status: 'rejected' });
            alert("উত্তোলন রিকোয়েস্ট বাতিল করা হয়েছে।");
          }

          loadWithdrawRequests();
        } catch (error) {
          console.error("Error:", error);
          alert("সমস্যা হয়েছে!");
        }
      }
    </script>
</body>
</html>
