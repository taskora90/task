<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নিরাপত্তা সতর্কবার্তা - Security Warning</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #d32f2f; /* লাল ব্যাকগ্রাউন্ড */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .warning-box {
      text-align: center;
      padding: 30px;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1); /* হালকা ট্রান্সপারেন্ট লুক */
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    .warning-box h1 {
      color: #000000; /* কালো কালি */
      font-size: 26px;
      line-height: 1.6;
      font-weight: bold;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="warning-box">
    <h1>
      এই ওয়েবসাইটের এডমিন প্যানেল খুঁজে পাওয়া এত সহজ না।<br>
      এর জন্য অনেক ভাবনার প্রয়োজন আছে।<br><br>
      তবে চেষ্টা করার জন্য আপনাকে শুভেচ্ছা।
    </h1>
  </div>

</body>
</html>
