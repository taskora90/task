<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
        .admin-container { max-width: 100%; width: 100%; margin: 0 auto; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab-btn { flex: 1; padding: 12px 5px; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 15px; text-align: center; }
        .tab-btn.active { border-bottom: 3px solid #007bff; color: #007bff; }
        .request-card { background: #fafafa; border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; word-break: break-all; }
        .btn-approve { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .btn-reject { background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>অ্যাডমিন ড্যাশবোর্ড</h2>

        <div class="tabs">
            <button class="tab-btn active" id="rechargeTabBtn" onclick="switchTab('recharge')">রিচার্জ রিকোয়েস্ট</button>
            <button class="tab-btn" id="withdrawTabBtn" onclick="switchTab('withdraw')">উত্তোলন রিকোয়েস্ট</button>
        </div>

        <!-- রিচার্জ সেকশন -->
        <div id="rechargeSection">
            <h3>রিচার্জ রিকোয়েস্ট তালিকা</h3>
            <div id="rechargeList">লোড হচ্ছে...</div>
        </div>

        <!-- উত্তোলন সেকশন -->
        <div id="withdrawSection" style="display: none;">
            <h3>উত্তোলন রিকোয়েস্ট তালিকা</h3>
            <div id="withdrawList">লোড হচ্ছে...</div>
        </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // পেজ লোড হওয়ার সাথে সাথে রিচার্জ লোড করবে
      document.addEventListener("DOMContentLoaded", () => {
        loadRechargeRequests();
      });

      window.switchTab = function(type) {
        if(type === 'recharge') {
          document.getElementById('rechargeSection').style.display = 'block';
          document.getElementById('withdrawSection').style.display = 'none';
          document.getElementById('rechargeTabBtn').classList.add('active');
          document.getElementById('withdrawTabBtn').classList.remove('active');
          loadRechargeRequests();
        } else {
          document.getElementById('rechargeSection').style.display = 'none';
          document.getElementById('withdrawSection').style.display = 'block';
          document.getElementById('withdrawTabBtn').classList.add('active');
          document.getElementById('rechargeTabBtn').classList.remove('active');
          loadWithdrawRequests();
        }
      }

      // রিচার্জ রিকোয়েস্ট লোড করা
      async function loadRechargeRequests() {
        const listEl = document.getElementById('rechargeList');
        if (!listEl) return;
        listEl.innerHTML = "লোড হচ্ছে...";

        try {
          const querySnap = await getDocs(collection(db, "recharge_requests"));
          if (querySnap.empty) {
            listEl.innerHTML = "কোনো রিচার্জ রিকোয়েস্ট নেই।";
            return;
          }

          listEl.innerHTML = "";
          querySnap.forEach((d) => {
            const data = d.data();
            if (data.status === 'pending') {
              listEl.innerHTML += `
                <div class="request-card">
                  <p>ইউজার: <strong>${data.userEmail || 'N/A'}</strong></p>
                  <p>পরিমাণ: <strong>৳ ${data.amount}</strong></p>
                  <p>মেথড: <strong>${data.method}</strong></p>
                  <p>TrxID: <strong style="color: #007bff;">${data.trxId}</strong></p>
                  <p>স্ট্যাটাস: <em>${data.status}</em></p>
                  <button class="btn-approve" onclick="handleRecharge('${d.id}', '${data.userId}', ${data.amount})">এপ্রুভ</button>
                  <button class="btn-reject" onclick="handleRejection('${d.id}')">রিজেক্ট</button>
                </div>
              `;
            }
          });

          if(listEl.innerHTML === "") {
            listEl.innerHTML = "কোনো পেন্ডিং রিচার্জ রিকোয়েস্ট নেই।";
          }
        } catch (error) {
          console.error("রিচার্জ লোড ত্রুটি:", error);
          listEl.innerHTML = "ডেটা লোড করতে সমস্যা হয়েছে।";
        }
      }

      // রিচার্জ এপ্রুভ (myCash এ যোগ হবে)
      window.handleRecharge = async function(rechargeId, userId, amount) {
        try {
          const userRef = doc(db, "users", userId);
          const rechargeRef = doc(db, "recharge_requests", rechargeId);

          await updateDoc(userRef, {
            myCash: increment(amount)
          });

          await updateDoc(rechargeRef, { status: 'approved' });
          alert("রিচার্জ সফলভাবে অনুমোদিত হয়েছে এবং মাই ক্যাশে টাকা যোগ হয়েছে!");
          loadRechargeRequests();
        } catch (error) {
          console.error("Error:", error);
          alert("সমস্যা হয়েছে!");
        }
      }

      // রিচার্জ রিজেক্ট
      window.handleRejection = async function(rechargeId) {
        try {
          const rechargeRef = doc(db, "recharge_requests", rechargeId);
          await updateDoc(rechargeRef, { status: 'rejected' });
          alert("রিচার্জ রিকোয়েস্ট বাতিল করা হয়েছে।");
          loadRechargeRequests();
        } catch (error) {
          console.error("Error:", error);
          alert("সমস্যা হয়েছে!");
        }
      }

      // উত্তোলন রিকোয়েস্ট লোড করা
      async function loadWithdrawRequests() {
        const listEl = document.getElementById('withdrawList');
        if (!listEl) return;
        listEl.innerHTML = "লোড হচ্ছে...";

        try {
          const querySnap = await getDocs(collection(db, "withdrawals"));
          if (querySnap.empty) {
            listEl.innerHTML = "কোনো উত্তোলন রিকোয়েস্ট নেই।";
            return;
          }

          listEl.innerHTML = "";
          querySnap.forEach((d) => {
            const data = d.data();
            if (data.status === 'waiting' || data.status === 'processing') {
              listEl.innerHTML += `
                <div class="request-card">
                  <p>ইউজার: <strong>${data.userEmail}</strong></p>
                  <p>পরিমাণ: <strong>৳ ${data.amount}</strong></p>
                  <p>মেথড: ${data.method} (${data.account})</p>
                  <p>স্ট্যাটাস: <em>${data.status}</em></p>
                  <button class="btn-approve" onclick="handleWithdraw('${d.id}', '${data.userId}', ${data.amount}, 'approve')">এপ্রুভ</button>
                  <button class="btn-reject" onclick="handleWithdraw('${d.id}', '${data.userId}', ${data.amount}, 'reject')">রিজেক্ট</button>
                </div>
              `;
            }
          });
        } catch (error) {
          console.error("Error:", error);
          listEl.innerHTML = "ডেটা লোড করতে সমস্যা হয়েছে।";
        }
      }

      window.handleWithdraw = async function(withdrawId, userId, amount, action) {
        try {
          const userRef = doc(db, "users", userId);
          const withdrawRef = doc(db, "withdrawals", withdrawId);

          if (action === 'approve') {
            const userSnap = await getDoc(userRef);
            if(userSnap.exists()) {
              const currentTaskCash = userSnap.data().taskCash || 0;
              if(currentTaskCash < amount) {
                alert("ইউজারের টাস্ক ক্যাশে পর্যাপ্ত টাকা নেই!");
                return;
              }
            }

            await updateDoc(userRef, {
              taskCash: increment(-amount)
            });

            await updateDoc(withdrawRef, { status: 'approved' });
            alert("উত্তোলন সফলভাবে অনুমোদিত হয়েছে এবং টাস্ক ক্যাশ থেকে টাকা কাটা হয়েছে!");
          } else {
            await updateDoc(withdrawRef, { status: 'rejected' });
            alert("উত্তোলন রিকোয়েস্ট বাতিল করা হয়েছে।");
          }

          loadWithdrawRequests();
        } catch (error) {
          console.error("Error:", error);
          alert("সমস্যা হয়েছে!");
        }
      }
    </script>
</body>
</html>
