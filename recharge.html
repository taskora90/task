<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিচার্জ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- টপ হেডার -->
    <header class="top-banner">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>টাকা রিচার্জ করুন</h2>
    </header>

    <div class="recharge-container">
        <!-- পেমেন্ট মেথড নির্বাচন -->
        <h3>পেমেন্ট মাধ্যম সিলেক্ট করুন</h3>
        <div class="payment-methods">
            <button class="method-btn active" onclick="selectMethod('bKash')">
                <i class="fa-solid fa-mobile-screen-button"></i> বিকাশ (bKash)
            </button>
            <button class="method-btn" onclick="selectMethod('Nagad')">
                <i class="fa-solid fa-mobile-screen-button"></i> নগদ (Nagad)
            </button>
        </div>

        <!-- ফিক্সড নম্বর কার্ড -->
        <div class="number-box">
            <p><span id="method-name">বিকাশ</span> পার্সোনাল নম্বর:</p>
            <div class="copy-box">
                <strong id="agent-number">01700000000</strong>
                <button onclick="copyNumber()"><i class="fa-regular fa-copy"></i> কপি</button>
            </div>
        </div>

        <!-- ফর্ম -->
        <form class="recharge-form" id="rechargeForm">
            <div class="form-group">
                <label>টাকার পরিমাণ (BDT)</label>
                <input type="number" id="amount" placeholder="সর্বনিম্ন ৫০০ টাকা" min="500" required>
            </div>

            <div class="form-group">
                <label>ট্রানজেকশন আইডি (TrxID)</label>
                <input type="text" id="trxId" placeholder="যেমন: 8N7A6D5E" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">জমা দিন</button>
        </form>
    </div>

    <!-- UI Scripts -->
    <script>
        let selectedPaymentMethod = 'bKash';

        function selectMethod(method) {
            selectedPaymentMethod = method;
            document.getElementById('method-name').innerText = method;
            let btns = document.querySelectorAll('.method-btn');
            btns.forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if(method === 'bKash') {
                document.getElementById('agent-number').innerText = '01700000000'; // আপনার বিকাশ নম্বর
            } else {
                document.getElementById('agent-number').innerText = '01800000000'; // আপনার নগদ নম্বর
            }
        }

        function copyNumber() {
            let num = document.getElementById('agent-number').innerText;
            navigator.clipboard.writeText(num);
            alert('নম্বর কপি হয়েছে: ' + num);
        }
    </script>

    <!-- Firebase Backend Integration -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let currentUser = null;

      // ইউজার অথেন্টিকেশন স্টেট চেক
      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
        } else {
          alert("রিচার্জ করার জন্য অনুগ্রহ করে প্রথমে লগইন করুন।");
          window.location.href = "login.html";
        }
      });

      // রিচার্জ ফর্ম সাবমিশন লজিক
      const rechargeForm = document.getElementById('rechargeForm');
      const submitBtn = document.getElementById('submitBtn');

      rechargeForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!currentUser) {
          alert("ইউজার সেশন পাওয়া যায়নি। অনুগ্রহ করে আবার লগইন করুন।");
          return;
        }

        const amount = Number(document.getElementById('amount').value);
        const trxId = document.getElementById('trxId').value.trim();

        if (amount < 500) {
          alert("সর্বনিম্ন রিচার্জ পরিমাণ ৫০০ টাকা।");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "প্রসেসিং হচ্ছে...";

        try {
          await addDoc(collection(db, "recharge_requests"), {
            userId: currentUser.uid,
            userEmail: currentUser.email || "",
            amount: amount,
            trxId: trxId,
            method: selectedPaymentMethod,
            status: "pending",
            createdAt: serverTimestamp()
          });

          alert("আপনার রিচার্জের আবেদনটি সফলভাবে জমা হয়েছে। অ্যাডমিন ভেরিফাই করে অ্যাপ্রুভ করার সাথে সাথেই টাকা আপনার মাই ক্যাশে যোগ হয়ে যাবে।");
          rechargeForm.reset();
        } catch (error) {
          console.error("রিচার্জ আবেদন জমা দিতে ত্রুটি:", error);
          alert("আবেদন জমা দিতে সমস্যা হয়েছে, অনুগ্রহ করে আবার চেষ্টা করুন।");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = "জমা দিন";
        }
      });
    </script>
</body>
</html>
