<!-- withdraw.html -->
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাকা উত্তোলন</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #dcdcdc; margin: 0; padding: 20px; color: #333; }
        .withdraw-container { max-width: 450px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 20px; color: #2b2d42; }
        .balance-box { background: #eef2f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 16px; font-weight: bold; }
        .payment-methods { display: flex; gap: 15px; margin-bottom: 20px; }
        .method-btn { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; cursor: pointer; background: #fff; transition: 0.3s; }
        .method-btn.active { background-color: #007bff; color: white; border-color: #007bff; }
        .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .amount-btn { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; cursor: pointer; background: #fbfbfb; transition: 0.3s; }
        .amount-btn.active { background-color: #28a745; color: white; border-color: #28a745; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; background-color: #eef2f5; }
        .form-group input:focus { outline: none; border-color: #007bff; }
        .submit-btn { width: 100%; background: #28a745; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .submit-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="withdraw-container">
        <h2 class="header"><i class="fa-solid fa-money-bill-transfer"></i> টাকা উত্তোলন</h2>
        
        <div class="balance-box">
            বর্তমান টাস্ক ক্যাশ: <strong id="availableTaskCash" style="color: #007bff;">৳ 0</strong>
        </div>

        <h3>পেমেন্ট মাধ্যম সিলেক্ট করুন:</h3>
        <div class="payment-methods">
            <button class="method-btn active" id="bKashBtn" onclick="selectMethod('bKash')">বিকাশ</button>
            <button class="method-btn" id="NagadBtn" onclick="selectMethod('Nagad')">নগদ</button>
        </div>

        <h3>উত্তোলনের পরিমাণ সিলেক্ট করুন:</h3>
        <div class="amount-grid">
            <button class="amount-btn" onclick="selectAmount(500)">500</button>
            <button class="amount-btn" onclick="selectAmount(1000)">1000</button>
            <button class="amount-btn" onclick="selectAmount(1500)">1500</button>
            <button class="amount-btn" onclick="selectAmount(2000)">2000</button>
            <button class="amount-btn" onclick="selectAmount(2500)">2500</button>
            <button class="amount-btn" onclick="selectAmount(3000)">3000</button>
        </div>

        <div class="form-group">
            <label>নির্বাচিত পরিমাণ (৳)</label>
            <!-- এখানে readonly দেওয়া হয়েছে যাতে কেউ টাইপ করতে না পারে -->
            <input type="number" id="withdrawAmount" placeholder="উপরের বাটন থেকে সিলেক্ট করুন" readonly>
        </div>
        <div class="form-group">
            <label>রিসিভ করার অ্যাকাউন্ট নম্বর</label>
            <input type="text" id="accountNo" placeholder="আপনার বিকাশ/নগদ নম্বর দিন">
        </div>

        <button class="btn submit-btn" id="withdrawBtn">উত্তোলন রিকোয়েস্ট পাঠান</button>
        
        <br><br>
        <a href="profile.html" style="text-decoration: none; color: #6c757d;"><i class="fa-solid fa-arrow-left"></i> প্রোফাইলে ফিরে যান</a>
    </div>

    <!-- Firebase ও উইথড্র লজিক -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let currentTaskCash = 0;
      let currentUser = null;
      let selectedMethod = 'bKash';
      let selectedAmount = 0;

      window.selectMethod = function(method) {
        selectedMethod = method;
        document.getElementById('bKashBtn').classList.remove('active');
        document.getElementById('NagadBtn').classList.remove('active');
        document.getElementById(method + 'Btn').classList.add('active');
      };

      window.selectAmount = function(amount) {
        selectedAmount = amount;
        document.querySelectorAll('.amount-grid .amount-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('withdrawAmount').value = amount;
      };

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) {
            currentTaskCash = userDoc.data().taskCash || 0;
            document.getElementById('availableTaskCash').innerText = `৳ ${currentTaskCash}`;
          }
        } else {
          window.location.href = "login.html";
        }
      });

      document.getElementById('withdrawBtn').onclick = async () => {
        const amount = selectedAmount;
        const account = document.getElementById('accountNo').value.trim();

        if (!amount || amount <= 0) {
          alert("অনুগ্রহ করে ওপরের বাটন থেকে উত্তোলনের একটি নির্দিষ্ট পরিমাণ নির্বাচন করুন!");
          return;
        }
        if (!account) {
          alert("অনুগ্রহ করে আপনার অ্যাকাউন্ট নম্বর দিন!");
          return;
        }

        if (amount > currentTaskCash) {
          alert("আপনার টাস্ক ক্যাশে পর্যাপ্ত টাকা নেই!");
          return;
        }

        document.getElementById('withdrawBtn').disabled = true;
        document.getElementById('withdrawBtn').innerText = "প্রসেসিং...";

        try {
          await addDoc(collection(db, "withdrawals"), {
            userId: currentUser.uid,
            userEmail: currentUser.email,
            amount: amount,
            method: selectedMethod,
            account: account,
            status: "waiting",
            timestamp: serverTimestamp()
          });

          alert("উত্তোলন রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!");
          window.location.href = "profile.html";
        } catch (error) {
          console.error("Error:", error);
          alert("সমস্যা হয়েছে, আবার চেষ্টা করুন।");
        } finally {
          document.getElementById('withdrawBtn').disabled = false;
          document.getElementById('withdrawBtn').innerText = "উত্তোলন রিকোয়েস্ট পাঠান";
        }
      };
    </script>
</body>
</html>
