<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাকা উত্তোলন</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .withdraw-container { max-width: 450px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="withdraw-container">
        <h2><i class="fa-solid fa-money-bill-transfer"></i> টাকা উত্তোলন</h2>
        <p>টাস্ক ক্যাশ থেকে আপনার বিকাশ/নগদ নম্বরে টাকা তুলুন।</p>
        
        <div style="background: #eef2f5; padding: 10px; border-radius: 6px; margin-bottom: 15px;">
            বর্তমান টাস্ক ক্যাশ: <strong id="availableTaskCash">৳ 0</strong>
        </div>

        <div class="form-group">
            <label>উত্তোলনের পরিমাণ (টাকা)</label>
            <input type="number" id="withdrawAmount" placeholder="পরিমাণ লিখুন">
        </div>
        <div class="form-group">
            <label>পেমেন্ট মেথড</label>
            <input type="text" id="paymentMethod" placeholder="বিকাশ / নগদ">
        </div>
        <div class="form-group">
            <label>অ্যাকাউন্ট নম্বর</label>
            <input type="text" id="accountNo" placeholder="আপনার নম্বর">
        </div>

        <button class="btn" id="withdrawBtn">উত্তোলন রিকোয়েস্ট পাঠান</button>
        
        <br><br>
        <a href="profile.html" style="text-decoration: none; color: #007bff;"><i class="fa-solid fa-arrow-left"></i> প্রোফাইলে ফিরে যান</a>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, collection, addRef, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let currentTaskCash = 0;
      let currentUser = null;

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) {
            currentTaskCash = userDoc.data().taskCash || 0;
            document.getElementById('availableTaskCash').innerText = `৳ ${currentTaskCash}`;
          }
        } else {
          window.location.href = "login.html";
        }
      });

      document.getElementById('withdrawBtn').onclick = async () => {
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const method = document.getElementById('paymentMethod').value;
        const account = document.getElementById('accountNo').value;

        if (!amount || amount <= 0 || !method || !account) {
          alert("দয়া করে সব তথ্য সঠিকভাবে পূরণ করুন!");
          return;
        }

        if (amount > currentTaskCash) {
          alert("আপনার টাস্ক ক্যাশে পর্যাপ্ত পরিমাণ টাকা নেই!");
          return;
        }

        try {
          // উইথড্র রিকোয়েস্ট ডাটাবেজে পাঠানো (initial status: waiting)
          await addDoc(collection(db, "withdrawals"), {
            userId: currentUser.uid,
            userEmail: currentUser.email,
            amount: amount,
            method: method,
            account: account,
            status: "waiting", // waiting -> bank processing -> approved/rejected
            timestamp: serverTimestamp()
          });

          alert("উত্তোলন রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!");
          window.location.href = "profile.html";
        } catch (error) {
          console.error("Error:", error);
          alert("সমস্যা হয়েছে, আবার চেষ্টা করুন।");
        }
      };
    </script>
</body>
</html>
