<html lang="bn">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #e9eef5 0%, #f5f7fa 100%);
            margin: 0;

            color: #2e3440;

        }

        .withdraw-container {
            max-width: 450px;
            margin: 8px auto 0;
            background: #ffffff;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 12px 28px rgba(46, 52, 64, 0.10), 0 2px 6px rgba(46, 52, 64, 0.05);

        .header {
            display: flex;
            align-items: center;
            justify-content: center;

        .balance-box {

            color: #2e3440;

        }

        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            margin-bottom: 18px;
        }

        .amount-btn {
            padding: 11px 8px;
            border: 1.5px solid #d5dde7;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;

        }

        .amount-btn:hover {
            border-color: #5e81ac;

        .amount-btn.active {
            background: linear-gradient(135deg, #3b4252 0%, #5e81ac 100%);

            box-shadow: 0 4px 10px rgba(59, 66, 82, 0.22);

        .form-group {

        }

        .form-group label {
            display: block;
            margin-bottom: 7px;

        .form-group input,

            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cfd8e3;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            color: #2e3440;
            background-color: #f8fafc;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4c566a;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(76, 86, 106, 0.14);

        .form-group input[readonly] {
            background-color: #eef2f6 !important;
            color: #4c566a;

        #saveProfileBtn {
            background: linear-gradient(135deg, #3b4252 0%, #5e81ac 100%) !important;
            box-shadow: 0 6px 14px rgba(59, 66, 82, 0.22);

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 11px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15.5px;
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 6px 14px rgba(16, 185, 129, 0.25);
        }

        .submit-btn:hover {
            opacity: 0.96;
            box-shadow: 0 8px 18px rgba(16, 185, 129, 0.32);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            background: #b8c2ce;
            box-shadow: none;
            cursor: not-allowed;
        }

        .ad-banner-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-profile-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            text-decoration: none;
            color: #4c566a;
            font-size: 13.5px;
            font-weight: 700;
        }

        .back-profile-link:hover {
            color: #2e3440;
        }
    </style>
</head>
<body>

    <div class="withdraw-container">

        <!-- নোটিশ বক্স -->

            🔔 নোটিশ: উইথড্র সময় প্রতিদিন সকাল ১০:০০ টা থেকে বিকেল ৫:০০ টা পর্যন্ত। (শুক্রবার ও রবিবার বন্ধ)। প্রতিদিন মাত্র ১ বার উইথড্র করা যাবে।

        <!-- ১. উইথড্র প্রোফাইল তৈরির সেকশন -->
        <div id="profileSetupSection" class="profile-setup-box" style="display: none;">
            <h3>উইথড্র প্রোফাইল তৈরি করুন</h3>

            <h3>উত্তোলনের পরিমাণ সিলেক্ট করুন:</h3>
            <div class="amount-grid">
                <button type="button" class="amount-btn" onclick="selectAmount(500, this)">500</button>

                <button type="button" class="amount-btn" onclick="selectAmount(2500, this)">2500</button>
                <button type="button" class="amount-btn" onclick="selectAmount(3000, this)">3000</button>
            </div>

            <div class="form-group" style="position: relative;">
                <label>নির্বাচিত পরিমাণ (৳)</label>

                <small id="vatNotice" style="display: none; color: #dc2626; font-size: 12px; margin-top: 5px; font-weight: 700;">VAT -১০%</small>

            <button type="button" class="submit-btn" id="withdrawBtn">উত্তোলন রিকোয়েস্ট পাঠান</button>
        </div>

        <!-- ব্যানার স্লট ২ -->
        <div class="ad-banner-container">
            <script>
              atOptions = {
                'key' : 'ef70bb41c6b9c54cf3d9448db4f94f11',
                'format' : 'iframe',

            <script type="text/javascript" src="//www.highperformanceformat.com/ef70bb41c6b9c54cf3d9448db4f94f11/invoke.js"></script>

    <!-- Firebase ও উইথড্র লজিক -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, setDoc, collection, addDoc, serverTimestamp, runTransaction, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBITIN70jLaM8XCXhCjYKbg2uhdG6yFOS4",
        authDomain: "taskora-b2b29.firebaseapp.com",
        projectId: "taskora-b2b29",
        storageBucket: "taskora-b2b29.firebasestorage.app",
        messagingSenderId: "376297360134",
        appId: "1:376297360134:web:ba6ab17055df42a8e36c87",
        measurementId: "G-9803M7DPM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let currentTaskCash = 0;
      let currentUser = null;
      let selectedAmount = 0;
      let userWithdrawMethod = "";
      let userWithdrawAccount = "";

      const DAY_KEYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
      const DAY_BN = {
        sun: "রবিবার",
        mon: "সোমবার",
        tue: "মঙ্গলবার",
        wed: "বুধবার",
        thu: "বৃহস্পতিবার",
        fri: "শুক্রবার",
        sat: "শনিবার"
      };

      let withdrawScheduleConfig = {
        openDays: ["sun", "mon", "tue", "wed", "thu", "sat"],
        startTime: "10:00",
        endTime: "17:00",
        maxPerDay: 1
      };

      // ডিভাইসের ঘড়ি বদলালে সুরক্ষার জন্য নেটওয়ার্ক/সার্ভার রেফারেন্স সময় সংগ্রহ
      async function getTrustedNowDate() {
        let baseMs = Date.now();
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2500);
          const resp = await fetch(window.location.href, {
            method: "HEAD",
            cache: "no-store",
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          const dateHeader = resp.headers.get("date");
          if (dateHeader) {
            const parsedMs = Date.parse(dateHeader);
            if (!Number.isNaN(parsedMs)) {
              baseMs = parsedMs;
            }
          }
        } catch (_) {
          // নেটওয়ার্ক হেডার না পাওয়া গেলে ফলব্যাক সময় ব্যবহৃত হবে
        }
        return new Date(baseMs);
      }

      // এশিয়া/ঢাকা টাইমজোন অনুযায়ী তারিখ, বার ও মিনিট বের করা
      function getDhakaScheduleParts(dateObj) {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Dhaka",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          weekday: "short",
          hour12: false
        }).formatToParts(dateObj);

        const y = parts.find(p => p.type === "year")?.value || "1970";
        const m = parts.find(p => p.type === "month")?.value || "01";
        const d = parts.find(p => p.type === "day")?.value || "01";
        const rawHour = Number(parts.find(p => p.type === "hour")?.value || 0);
        const hour = rawHour === 24 ? 0 : rawHour;
        const minute = Number(parts.find(p => p.type === "minute")?.value || 0);
        const wd = (parts.find(p => p.type === "weekday")?.value || "sun").toLowerCase().slice(0, 3);
        const dayIndex = DAY_KEYS.indexOf(wd);

        return {
          todayStr: `${y}-${m}-${d}`,
          dayKey: DAY_KEYS[dayIndex >= 0 ? dayIndex : 0],
          currentMinutes: hour * 60 + minute
        };
      }

      function timeToMinutes(hhmm) {
        if (!hhmm || !hhmm.includes(":")) return null;
        const [h, m] = hhmm.split(":").map(Number);
        if (Number.isNaN(h) || Number.isNaN(m)) return null;
        return h * 60 + m;
      }

      function formatMinutes12h(totalMins) {
        const h24 = Math.floor(totalMins / 60) % 24;
        const mins = totalMins % 60;
        let period = "সকাল";
        if (h24 >= 12 && h24 < 15) {
          period = "দুপুর";
        } else if (h24 >= 15 && h24 < 18) {
          period = "বিকেল";
        } else if (h24 >= 18) {
          period = "রাত";
        }
        const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
        return `${h12}:${String(mins).padStart(2, "0")} ${period}`;
      }

      async function loadWithdrawScheduleFromAdmin() {
        try {
          const snap = await getDoc(doc(db, "admin_settings", "holiday_rules"));
          if (snap.exists() && snap.data().withdraw) {
            const w = snap.data().withdraw;
            if (Array.isArray(w.openDays)) withdrawScheduleConfig.openDays = w.openDays;
            if (w.startTime) withdrawScheduleConfig.startTime = w.startTime;
            if (w.endTime) withdrawScheduleConfig.endTime = w.endTime;
            if (w.maxPerDay !== undefined && Number(w.maxPerDay) > 0) {
              withdrawScheduleConfig.maxPerDay = Number(w.maxPerDay);
            }
          }
        } catch (err) {
          console.error("Withdraw schedule load error:", err);
        }

        const closedNames = DAY_KEYS
          .filter((k) => !withdrawScheduleConfig.openDays.includes(k))
          .map((k) => DAY_BN[k]);

        const startM = timeToMinutes(withdrawScheduleConfig.startTime) ?? (10 * 60);
        const endM = timeToMinutes(withdrawScheduleConfig.endTime) ?? (17 * 60);
        const maxPerDay = withdrawScheduleConfig.maxPerDay || 1;
        const noticeEl = document.getElementById("withdrawScheduleNotice");
        if (noticeEl) {
          const closedText = closedNames.length ? `(${closedNames.join(" ও ")} বন্ধ)` : "(সব দিন চালু)";
          noticeEl.innerHTML = `🔔 নোটিশ: উইথড্র সময় ${formatMinutes12h(startM)} থেকে ${formatMinutes12h(endM)} পর্যন্ত। ${closedText}। প্রতিদিন মাত্র ${maxPerDay} বার উইথড্র করা যাবে।`;
        }
      }

      window.selectAmount = function(amount, btnEl) {
        selectedAmount = amount;
        let amountAfterVat = amount - (amount * 0.10);

        document.querySelectorAll('.amount-grid .amount-btn').forEach(btn => btn.classList.remove('active'));
        const targetBtn = btnEl || (typeof event !== "undefined" && event?.currentTarget) || null;
        if (targetBtn) {
          targetBtn.classList.add('active');
        }

        document.getElementById('withdrawAmount').value = amountAfterVat;
        document.getElementById('vatNotice').style.display = 'block';
      };

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          await loadWithdrawScheduleFromAdmin();

          const userDocRef = doc(db, "users", user.uid);
          const userDoc = await getDoc(userDocRef);

          if (userDoc.exists()) {
            currentTaskCash = userDoc.data().taskCash || 0;
            document.getElementById('availableTaskCash').innerText = `৳ ${Number(currentTaskCash).toFixed(2)}`;
          }

          const profileDocRef = doc(db, "withdrawProfiles", user.uid);
          const profileDoc = await getDoc(profileDocRef);

          if (profileDoc.exists()) {
            const profileData = profileDoc.data();
            userWithdrawMethod = profileData.method;
            userWithdrawAccount = profileData.account;

            document.getElementById('profileSetupSection').style.display = 'none';
            document.getElementById('mainWithdrawSection').style.display = 'block';

            document.getElementById('displayMethod').innerText = userWithdrawMethod === 'bKash' ? 'বিকাশ' : 'নগদ';
            document.getElementById('displayAccountNo').value = userWithdrawAccount;
          } else {
            document.getElementById('profileSetupSection').style.display = 'block';
            document.getElementById('mainWithdrawSection').style.display = 'none';
          }

        } else {
          window.location.href = "login.html";
        }
      });

      document.getElementById('saveProfileBtn').onclick = async () => {
        const method = document.getElementById('setupMethod').value;
        const account = document.getElementById('setupAccountNo').value.trim();

        if (!account) {
          alert("দয়া করে আপনার বিকাশ বা নগদ একাউন্ট নম্বর দিন!");
          return;
        }

        const saveBtn = document.getElementById('saveProfileBtn');
        saveBtn.disabled = true;
        saveBtn.innerText = "সেভ হচ্ছে...";

        try {
          let userIdentifier = currentUser.email;
          if (!userIdentifier && currentUser.phoneNumber) {
            userIdentifier = currentUser.phoneNumber + "@taskora90.app";
          }
          if (!userIdentifier) {
            userIdentifier = currentUser.uid + "@taskora90.app";
          }

          const profileDocRef = doc(db, "withdrawProfiles", currentUser.uid);
          await setDoc(profileDocRef, {
            userId: currentUser.uid,
            userEmailOrPhone: userIdentifier,
            method: method,
            account: account,
            createdAt: serverTimestamp()
          });

          alert("উইথড্র প্রোফাইল সফলভাবে তৈরি হয়েছে!");
          window.location.reload();
        } catch (error) {
          console.error("Profile Save Error:", error);
          alert("প্রোফাইল সেভ করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
          saveBtn.disabled = false;
          saveBtn.innerText = "প্রোফাইল সেভ করুন";
        }
      };

      document.getElementById('withdrawBtn').onclick = async () => {
        const fullAmountToDeduct = selectedAmount;
        const finalRequestAmount = selectedAmount - (selectedAmount * 0.10);

        await loadWithdrawScheduleFromAdmin();

        const trustedNow = await getTrustedNowDate();
        const { todayStr, dayKey, currentMinutes } = getDhakaScheduleParts(trustedNow);

        if (!withdrawScheduleConfig.openDays.includes(dayKey)) {
          alert(`দুঃখিত 😶 আজ (${DAY_BN[dayKey]}) উত্তোলন প্রক্রিয়া বন্ধ!`);
          return;
        }

        const startM = timeToMinutes(withdrawScheduleConfig.startTime) ?? (10 * 60);
        const endM = timeToMinutes(withdrawScheduleConfig.endTime) ?? (17 * 60);
        if (currentMinutes < startM || currentMinutes > endM) {
          alert(`উইথড্র করার সময় ${formatMinutes12h(startM)} থেকে ${formatMinutes12h(endM)} পর্যন্ত!`);
          return;
        }

        if (!fullAmountToDeduct || fullAmountToDeduct <= 0) {
          alert("অনুগ্রহ করে ওপরের বাটন থেকে উত্তোলনের একটি নির্দিষ্ট পরিমাণ নির্বাচন করুন!");
          return;
        }

        if (fullAmountToDeduct > currentTaskCash) {
          alert("আপনার ক্যাশে পর্যাপ্ত টাকা নেই!");
          return;
        }

        const submitBtn = document.getElementById('withdrawBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "প্রসেসিং...";

        try {
          const q = query(collection(db, "withdrawals"), where("userId", "==", currentUser.uid));
          const querySnapshot = await getDocs(q);

          let todayRequests = [];

          querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            let reqDateStr = "";
            if (data.timestamp && data.timestamp.toDate) {
              reqDateStr = getDhakaScheduleParts(data.timestamp.toDate()).todayStr;
            } else if (data.createdAt && data.createdAt.toDate) {
              reqDateStr = getDhakaScheduleParts(data.createdAt.toDate()).todayStr;
            }

            if (reqDateStr === todayStr) {
              todayRequests.push(data);
            }
          });

          todayRequests.sort((a, b) => {
            let timeA = a.timestamp?.toMillis() || a.createdAt?.toMillis() || 0;
            let timeB = b.timestamp?.toMillis() || b.createdAt?.toMillis() || 0;
            return timeB - timeA;
          });

          const todayCount = todayRequests.length;
          const latestReq = todayCount > 0 ? todayRequests[0] : null;
          const rejectedCount = todayRequests.filter((r) => r.status === "rejected").length;
          const adminMaxPerDay = withdrawScheduleConfig.maxPerDay || 1;

          // ১. ওয়েটিং বা পেন্ডিং থাকলে নতুন রিকোয়েস্ট দেওয়া যাবে না
          if (latestReq && (latestReq.status === "waiting" || latestReq.status === "pending")) {
            throw new Error("⚠️ আপনার একটি উইথড্র রিকোয়েস্ট বর্তমানে পেন্ডিং অবস্থায় আছে। নতুন করে উইথড্র করা যাবে না।");
          }

          // ২. রিজেক্ট হলে সর্বোচ্চ ১ বারই অতিরিক্ত সুযোগ পাবে; এরপরও রিজেক্ট হলে আর করতে পারবে না
          if (rejectedCount >= 2) {
            throw new Error("⚠️ আজকের দিনে আর উইথড্র করা যাবে না।");
          }

          const extraRejectAllowance = rejectedCount === 1 ? 1 : 0;
          const maxAllowedToday = adminMaxPerDay + extraRejectAllowance;

          if (todayCount >= maxAllowedToday) {
            throw new Error("⚠️ আজকের উইথড্র লিমিট শেষ! দিনে নির্ধারিত বারের বেশি উইথড্র করা যাবে না।");
          }

          const userDocRef = doc(db, "users", currentUser.uid);

          await runTransaction(db, async (transaction) => {
            const userDocSnap = await transaction.get(userDocRef);
            if (!userDocSnap.exists()) {
              throw new Error("ইউজার ডাটা পাওয়া যায়নি!");
            }

            const userData = userDocSnap.data();
            const userPackage = userData.package || 'none';
            if (userPackage === 'none') {
              throw new Error("⚠️ দুঃখিত! উইথড্র করার জন্য আপনাকে অবশ্যই যেকোনো একটি প্যাকেজ কিনতে হবে।");
            }

            const latestTaskCash = userData.taskCash || 0;

            if (fullAmountToDeduct > latestTaskCash) {
              throw new Error("আপনার মাই ক্যাশে পর্যাপ্ত ব্যালেন্স নেই!");
            }

            transaction.update(userDocRef, {
              taskCash: latestTaskCash - fullAmountToDeduct,
              lastWithdrawDate: todayStr
            });
          });

          let userIdentifier = currentUser.email || currentUser.phoneNumber + "@taskora90.app" || "N/A";

          await addDoc(collection(db, "withdrawals"), {
            userId: currentUser.uid,
            userEmail: userIdentifier,
            amount: finalRequestAmount,
            deductedAmount: fullAmountToDeduct,
            method: userWithdrawMethod,
            account: userWithdrawAccount,
            status: "waiting",
            timestamp: serverTimestamp(),
            createdAt: serverTimestamp()
          });

          alert("উত্তোলন রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!");
          window.location.href = "profile.html";
        } catch (error) {
          console.error("Error:", error);
          alert(error.message || "সমস্যা হয়েছে, আবার চেষ্টা করুন।");
          submitBtn.disabled = false;
          submitBtn.innerText = "উত্তোলন রিকোয়েস্ট পাঠান";
        }
      };
    </script>
